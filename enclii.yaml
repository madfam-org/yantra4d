apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: yantra4d
  project: yantra4d
spec:
  domains:
    - name: 4d.madfam.io
      environment: production
      port: 80
    - name: 4d-api.madfam.io
      environment: production
      port: 80
    - name: 4d-app.madfam.io
      environment: production
      port: 80
    - name: 4d-admin.madfam.io
      environment: production
      port: 80
  runtime:
    port: 5000
  network:
    services:
      - name: yantra4d-landing
        port: 80
        ingress: [cloudflare-tunnel]
        egress: [dns]
      - name: yantra4d-backend
        port: 5000
        ingress: [cloudflare-tunnel]
        egress: [dns, https, postgres]
      - name: yantra4d-studio
        port: 80
        ingress: [cloudflare-tunnel]
        egress: [dns, https]
      - name: yantra4d-admin
        port: 80
        ingress: [cloudflare-tunnel]
        egress: [dns, https]
      - name: yantra4d-redis
        port: 0
        egress: [dns]
    custom:
      - name: landing-to-backend
        from: { app: yantra4d-landing }
        to: { app: yantra4d-backend }
        port: 5000
        direction: both
      - name: studio-to-backend
        from: { app: yantra4d-studio }
        to: { app: yantra4d-backend }
        port: 5000
        direction: both
      - name: admin-to-backend
        from: { app: yantra4d-admin }
        to: { app: yantra4d-backend }
        port: 5000
        direction: both
      - name: backend-to-redis
        from: { app: yantra4d-backend }
        to: { app: yantra4d-redis }
        port: 6379
        direction: both
