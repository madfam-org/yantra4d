services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ⚠️ Change REDIS_PASSWORD for production deployments.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-yantra4d_dev}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-yantra4d_dev}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The Studio and admin nginx configs proxy to `yantra4d-backend`, the
    # Kubernetes service name; this alias lets the same images reach the API here.
    networks:
      default:
        aliases:
          - yantra4d-backend
    shm_size: '2gb'
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./projects:/app/projects:ro
      - user_projects:/app/user-projects
      - render_output:/app/backend/static
      - analytics_data:/app/backend/data
    environment:
      - FLASK_DEBUG=false
      - PORT=5000
      - PROJECTS_DIR=/app/projects
      # Covers studio (5173 dev / 3000 docker), landing (4321), admin (3001) and additional dev ports
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:4321,http://localhost:3001
      - JANUA_ISSUER=${JANUA_ISSUER:-https://auth.madfam.io}
      - JANUA_AUDIENCE=${JANUA_AUDIENCE:-yantra4d-api}
      # ⚠️  WARNING: Auth and rate limiting are OFF for local dev.
      # Never deploy to production with these settings.
      # Production uses K8s manifests with AUTH_ENABLED=true.
      - AUTH_ENABLED=false
      # Self-hosted renders: the tier this auth-off stack is gated as on the
      # render path. `premium` unlocks the CadQuery and graph engines most Commons
      # cartridges need, and matches what /api/me already reports while auth is
      # off. Honoured only while AUTH_ENABLED is false (docs/AUTH.md, Harness tier).
      # Set SELF_HOST_TIER=guest to try the free limits. Every port below is
      # published on 127.0.0.1 only: an auth-off stack must not be reachable from
      # other machines. Turn auth on before serving it to anyone else.
      - HARNESS_TIER=${SELF_HOST_TIER:-premium}
      - PYTHONPATH=/app/backend
      - RATE_LIMIT_ENABLED=false
      - RATE_LIMIT_STORAGE=redis://:${REDIS_PASSWORD:-yantra4d_dev}@redis:6379
      - REDIS_URL=redis://:${REDIS_PASSWORD:-yantra4d_dev}@redis:6379
      - PUBLIC_STUDIO_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health/ready')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:5000}
        VITE_JANUA_BASE_URL: ${VITE_JANUA_BASE_URL:-}
        VITE_JANUA_CLIENT_ID: ${VITE_JANUA_CLIENT_ID:-yantra4d}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  render-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["python", "/app/worker/render_worker.py"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - FLASK_DEBUG=false
      - PROJECTS_DIR=/app/projects
      - AUTH_ENABLED=false
      - RATE_LIMIT_ENABLED=false
      - RATE_LIMIT_STORAGE=redis://:${REDIS_PASSWORD:-yantra4d_dev}@redis:6379
      - REDIS_URL=redis://:${REDIS_PASSWORD:-yantra4d_dev}@redis:6379
    volumes:
      - ./projects:/app/projects:ro
      - user_projects:/app/user-projects
      - render_output:/app/backend/static

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        PUBLIC_STUDIO_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "127.0.0.1:4321:80"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:5000}
        VITE_JANUA_BASE_URL: ${VITE_JANUA_BASE_URL:-}
        VITE_JANUA_CLIENT_ID: ${VITE_JANUA_CLIENT_ID:-yantra4d-admin}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  analytics_data:
  render_output:
  user_projects:
