server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Generated JSON the gallery fetches on demand (per-locale commons list, the
    # model manifest): content-addressed by build, not by filename, so a short
    # TTL rather than immutable. `expires` alone — an add_header here would
    # replace the inherited security headers below.
    location ~* ^/(data/.*\.json|models/manifest\.json)$ {
        expires 1h;
    }

    # Meshes. glb is missing from nginx's default mime.types; `types {}` scopes
    # the override to this location so the global table stays intact.
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|stl|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' http://localhost:*; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src https://app.yantra4d.com http://localhost:*; connect-src 'self' https://api.yantra4d.com https://cloudflareinsights.com http://localhost:* ws://localhost:* https://raw.githack.com https://raw.githubusercontent.com; worker-src 'self' blob:;" always;
}
