            type: string
      responses:
        "200":
          description: Storefront manifest without internal fields
        "404":
          description: Project not found

  /api/projects/{slug}/share/{preset_id}:
    get:
      tags: [storefront]
      summary: Get shareable preset configuration
      operationId: getSharePreset
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: preset_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preset configuration for sharing
        "404":
          description: Project or preset not found

  # ── Client Config ──────────────────────────────────────
  /api/config/client:
    get:
      tags: [config]
      summary: Client platform branding configuration
      operationId: getClientConfig
      responses:
        "200":
          description: Platform branding and feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform_name:
                    type: string
                  features:
                    type: object

  # ── Admin Flags ────────────────────────────────────────
  /api/admin/projects/{slug}/flags:
    patch:
      tags: [admin]
      summary: Toggle project flags (demo, hyperobject)
      operationId: patchProjectFlags
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_demo:
                  type: boolean
                is_hyperobject:
                  type: boolean
      responses:
        "200":
          description: Flags updated
        "404":
          description: Project not found

  # ── Assembly Steps ─────────────────────────────────────
  /api/projects/{slug}/assembly-steps:
    get:
      tags: [assembly]
      summary: Auto-generate assembly steps from BOSL2 attachments
      operationId: getAssemblySteps
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated assembly steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        order:
                          type: integer
                        label:
                          type: string
                        parts:
                          type: array
                          items:
                            type: string
        "404":
          description: Project not found

  /api/projects/{slug}/assembly-steps/write:
    post:
      tags: [assembly]
      summary: Write generated assembly steps to project manifest
      operationId: writeAssemblySteps
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merge:
                  type: boolean
                  description: Merge with existing steps instead of replacing
      responses:
        "200":
          description: Assembly steps written to manifest
        "404":
          description: Project not found
