openapi: 3.1.0
info:
  title: Yantra4D API
  version: 1.0.0
  description: |
    REST API for the Yantra4D parametric 3D design platform.
    Provides OpenSCAD rendering, project management, AI-assisted design,
    Git operations, and analytics.
  license:
    name: AGPL-3.0
    url: https://opensource.org/license/agpl-v3/

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://api.yantra4d.com
    description: Production

tags:
  - name: health
    description: Service health and readiness
  - name: projects
    description: Project listing, manifests, forking, and static assets
  - name: manifest
    description: Legacy single-project manifest endpoints
  - name: render
    description: OpenSCAD rendering (sync, streaming, estimate, cancel)
  - name: download
    description: Auth-gated file downloads (STL, SCAD)
  - name: editor
    description: In-browser SCAD file editor CRUD
  - name: git
    description: Git operations (status, diff, commit, push, pull)
  - name: github
    description: GitHub repository import and sync
  - name: ai
    description: AI-assisted design (session management, chat streaming)
  - name: bom
    description: Bill of materials generation
  - name: datasheet
    description: PDF/HTML datasheet generation
  - name: analytics
    description: Usage tracking and project analytics
  - name: user
    description: User info and tier management
  - name: onboard
    description: New project creation wizard
  - name: admin
    description: Administrative project management
  - name: printer
    description: 3D printer integration (OctoPrint/Moonraker)
  - name: animations
    description: Parametric animation rendering
  - name: materials
    description: Material hyperobject catalog
  - name: storefront
    description: Public storefront views and presets
  - name: catalog
    description: Hardware component catalogs (NopSCADlib)
  - name: config
    description: Client platform configuration
  - name: assembly
    description: Assembly step generation and management

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Janua-issued JWT token

  schemas:
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        error:
          type: string
      required: [status, error]

    ProjectLocked:
      type: object
      description: |
        Refusal returned with HTTP 403 by every project endpoint when the
        project is private and the caller is not entitled to it: the listing,
        manifest, meta, parts, storefront and share, downloads and exports,
        render / render-stream / render-cancel, verify, bom, datasheet,
        assembly, animations, cart, fork, the editor and git routes, analysis,
        simulation, the Cotiza export, the analytics summary, and
        `/static/<slug>_preview_*` render artifacts.

        Branch on `error_code`, not on the message. `auth_required` says which
        call to action to show: true when nobody is signed in (offer sign-in),
        false when the caller is signed in and still not entitled (offer
        request-access).
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: This project is private
        error_code:
          type: string
          enum: [project_locked]
        auth_required:
          type: boolean
          description: True when the request carried no identity at all.
        request_id:
          type: string
      required: [status, error, error_code, auth_required]

    WasmBundle:
      type: object
      description: |
        Everything a browser render of one OpenSCAD cartridge needs, in a single
        response: the full `include`/`use` closure of every OpenSCAD mode's
        entry file, the fonts it needs, and an honest account of what the WASM
        build cannot do.

        Every key of `files` and `fonts` is a POSIX path relative to a virtual
        root that mirrors the server's own layout — `projects/<slug>/…`,
        `libs/…`, `fonts/…` — so a cartridge's own
        `include <../../libs/BOSL2/std.scad>` resolves inside the worker without
        anyone rewriting the source. For includes that resolve through the
        search path rather than relatively, the worker sets OPENSCADPATH to
        `/libs:/libs/dotSCAD/src:/projects`.
      properties:
        slug:
          type: string
          example: din-rail-clip
        engine:
          type: string
          enum: [openscad]
          description: |
            The engine this bundle renders with. Always `openscad`: a dual-engine
            cartridge gets a bundle covering only the modes it renders with
            OpenSCAD, and a cartridge with no OpenSCAD modes is refused with 400.
        entry_files:
          type: array
          description: |
            `scad_file` of every mode the browser can render, as the manifest
            writes it (a bare name, relative to the cartridge root).
          items:
            type: string
          example: [rugged_complete.scad, rugged_bottom.scad]
        files:
          type: object
          description: Virtual path to UTF-8 source text, for every resolved SCAD file.
          additionalProperties:
            type: string
        fonts:
          type: object
          description: |
            Virtual path to base64-encoded font file, plus a `fonts.conf` entry
            holding the fontconfig XML the worker writes alongside them. The
            cartridge's own `fonts/` always travels; the shared font directory
            travels only when some resolved source calls `text(`.
          additionalProperties:
            type: string
        unsupported:
          type: array
          description: |
            Features this WASM build cannot honour. A non-empty list means the
            server is required for a faithful render.
          items:
            type: string
            enum: [import, surface, unresolved_includes]
        unresolved:
          type: array
          description: |
            `include`/`use` targets that could not be resolved, or that resolved
            outside the cartridge and the shared library tree. Reported as
            `"<including virtual path>: <target>"`.
          items:
            type: string
        bytes:
          type: integer
          description: Total bytes the worker writes into its filesystem — sources, fonts (pre-base64) and fonts.conf.
        etag:
          type: string
          description: SHA-256 over exactly this content; also returned as the ETag header for public projects.
      required: [slug, engine, entry_files, files, fonts, unsupported, unresolved, bytes, etag]

    BundleTooLarge:
      type: object
      description: |
        Refusal returned with HTTP 413 when a cartridge's source closure exceeds
        the bundle limits. The totals are included so the caller can see how far
        over it went rather than guessing.
      properties:
        status:
          type: string
          example: error
        error:
          type: string
          example: Project sources exceed the browser bundle limit
        error_code:
          type: string
          enum: [bundle_too_large]
        files:
          type: integer
        bytes:
          type: integer
        max_files:
          type: integer
          example: 600
        max_bytes:
          type: integer
          example: 25165824
        request_id:
          type: string
      required: [status, error, error_code, files, bytes, max_files, max_bytes]

    ProjectSummary:
      type: object
      properties:
        slug:
          type: string
          example: gridfinity
        name:
          type: string
          example: Gridfinity Bin
        description:
          type: object
          properties:
            en:
              type: string
            es:
              type: string
        thumbnail:
          type: string
        tags:
          type: array
          items:
            type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        stats:
          type: object
          description: Only present when ?stats=1
          properties:
            renders:
              type: integer
            exports:
              type: integer
            preset_applies:
              type: integer

    Manifest:
      type: object
      properties:
        project:
          type: object
          properties:
            name:
              type: string
            slug:
              type: string
            version:
              type: string
            description:
              type: object
            thumbnail:
              type: string
            tags:
              type: array
              items:
                type: string
            difficulty:
              type: string
            force_backend:
              type: boolean
              description: |
                SOFT hint that the server is preferred; the Studio may still
                render in the browser when the device is capable and the
                cartridge's wasm-bundle is complete. For a hard prohibition use
                the top-level `render.server_only`.
            hard_reload:
              type: boolean
              description: If true, studio clears configuration storage and ignores preset persistence on load.
        render:
          type: object
          description: |
            Where a render is allowed to happen — the hard rules, as opposed to
            project.force_backend's preference. These are cartridge-level facts;
            the requested `export_format` is a per-request one that pins the
            server just as hard.

          properties:
            server_only:
              type: boolean
              description: HARD - never render in the browser.
            browser_max_estimate_seconds:
              type: number
              description: Above this estimated render time the Studio prefers the server even on a capable device.
        modes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              scad_file:
                type: string
              label:
                type: object
              parts:
                type: array
                items:
                  type: string
              estimate:
                type: object
        parts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              render_mode:
                type: integer
              label:
                type: object
              default_color:
                type: string
        parameters:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              default:
                oneOf:
                  - type: number
                  - type: string
                  - type: boolean
              min:
                type: number
              max:
                type: number
              step:
                type: number
              label:
                type: object
              visible_in_modes:
                type: array
                items:
                  type: string
              widget:
                type: object
                properties:
                  type:
                    type: string
                    enum: [color-gradient, component-picker]
                  catalog:
                    type: string
                    description: Used when type is component-picker
        estimate_constants:
          type: object
          properties:
            base_time:
              type: number
            per_unit:
              type: number
            per_part:
              type: number
        presets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: object
              values:
                type: object
      required: [project, modes, parts, parameters, estimate_constants]

    RenderRequest:
      type: object
      properties:
        project:
          type: string
          description: Project slug
        mode:
          type: string
          description: Mode ID from manifest
        scad_file:
          type: string
          description: Deprecated — use mode instead
        parameters:
          type: object
          additionalProperties: true
        export_format:
          type: string
          enum: [stl, 3mf, off, step, glb, gltf, obj]
          default: stl
          description: |
            Anything but `stl` is necessarily a SERVER render. The Studio's
            browser kernel writes one file, `/output.stl`, and has no converter;
            `3mf` and `off` come from the native binary and `step`/`glb`/`gltf`/
            `obj` from trimesh or CadQuery. The Studio therefore treats a
            non-`stl` format as a hard server placement (rule 4 of
            `renderPlacement.ts`) rather than rendering in the browser and
            returning STL bytes under the requested extension. Whichever route
            produces it, the format is gated on the caller's tier here at
            generation and again at retrieval on
            `/api/projects/{slug}/download/...`.
        ignore_cache:
          type: boolean
          description: Bypass L1 and L2 caches to force a fresh render
          default: false
        request_id:
          type: string
          description: |
            Correlation handle for this render, and the target
            `POST /api/render-cancel` cancels it by. Server-generated (UUID4)
            when omitted; `/api/render-stream` publishes it on the `job` event.
            On `/api/render` the response arrives only when the render is done,
            so a caller that wants to be able to cancel must supply its own —
            and should make it unguessable, since anyone holding it can cancel
            the render.
      required: [mode]

    RenderCancelRequest:
      type: object
      description: |
        The cancel target. At least one of `request_id`, `job_ids` or `all` must
        be present; a body with none is a 400 `cancel_target_required`.
      properties:
        request_id:
          type: string
          description: Cancel every job of this render request
        job_ids:
          type: array
          maxItems: 64
          items:
            type: string
          description: Cancel exactly these jobs
        all:
          type: boolean
          description: Cancel every render on the box. Requires the admin role.
        project:
          type: string
          description: |
            Optional project slug. When given, the private-project gate is
            applied before anything is cancelled.
      minProperties: 1

    RenderResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        parts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              url:
                type: string
                format: uri
              size_bytes:
                type: integer
        log:
          type: string
        request_id:
          type: string
          description: The request_id this render ran under (echoed for correlation)

    EstimateRequest:
      type: object
      properties:
        project:
          type: string
        mode:
          type: string
        scad_file:
          type: string
        parameters:
          type: object

    EstimateResponse:
      type: object
      properties:
        estimated_seconds:
          type: number
        num_parts:
          type: integer
        num_units:
          type: number

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          example: healthy
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok:
                type: boolean
              detail:
                type: string
        debug_mode:
          type: boolean
      required: [status, checks]

paths:
  # ── Health ──────────────────────────────────────────────
  /api/health:
    get:
      tags: [health]
      summary: Health check
      description: Returns service status and OpenSCAD availability.
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Catalog ─────────────────────────────────────────────
  /api/catalog/nopscadlib:
    get:
      tags: [catalog]
      summary: List NopSCADlib catalog categories
      operationId: listCatalogCategories
      responses:
        "200":
          description: Available NopSCADlib categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: string
  
  /api/catalog/nopscadlib/{category}:
    get:
      tags: [catalog]
      summary: List components in a catalog category
      operationId: getCatalogCategory
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of components
          content:
            application/json:
              schema:
                type: object
                properties:
                  category:
                    type: string
                  count:
                    type: integer
                  components:
                    type: array
                    items:
                      type: object

  # ── Projects ────────────────────────────────────────────
  /api/projects:
    get:
      tags: [projects]
      summary: List all projects
      operationId: listProjects
      parameters:
        - name: stats
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Include 30-day analytics stats
      responses:
        "200":
          description: Array of project summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"

  /api/projects/{slug}/manifest:
    get:
      tags: [projects]
      summary: Get project manifest
      operationId: getProjectManifest
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full project manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        "304":
          description: Not modified (ETag match)
        "403":
          description: Project is private and the caller is not entitled to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLocked"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/projects/{slug}/wasm-bundle:
    get:
      tags: [projects, render]
      summary: Get the browser-render bundle for an OpenSCAD cartridge
      operationId: getProjectWasmBundle
      description: |
        Returns every source file, library and font the Studio's OpenSCAD WASM
        worker needs to render this cartridge in the browser, in one response.

        Resolution follows OpenSCAD's own rules: each `include`/`use` target is
        looked for relative to the including file's directory first, then along
        the server's OPENSCADPATH (LIBS_DIR, dotSCAD/src, PROJECTS_DIR), and the
        closure is walked recursively. A resolved file is only admitted when it
        lands inside the cartridge's own directory or the shared library tree;
        anything else is dropped and named in `unresolved`.

        Not rate-limited beyond the app-wide default: this is the free browser
        path, and throttling it by tier would only push traffic onto the render
        endpoints.

        Cached with `public, max-age=300` and a strong ETag; a private project
        is served `private, no-store` with no ETag and never 304s, exactly as
        its manifest is.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasmBundle"
        "304":
          description: Not modified (ETag match). Public projects only.
        "400":
          description: |
            The project has no mode this build can render in the browser —
            `error_code: engine_not_wasm` for a cadquery, graph or implicit
            cartridge, or an invalid slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Project is private and the caller is not entitled to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLocked"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Source closure exceeds the bundle limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BundleTooLarge"

  /api/projects/{slug}/meta:
    get:
      tags: [projects]
      summary: Get project metadata
      operationId: getProjectMeta
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project metadata or null
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                  - type: "null"

  /api/projects/{slug}/parts/{filename}:
    get:
      tags: [projects]
      summary: Serve static part file
      operationId: serveStaticPart
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Binary STL file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Path traversal blocked
        "404":
          description: File or project not found

  /api/projects/{slug}/fork:
    post:
      tags: [projects]
      summary: Fork a project
      operationId: forkProject
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_slug:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{1,48}[a-z0-9]$"
              required: [new_slug]
      responses:
        "200":
          description: Fork successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  slug:
                    type: string
        "400":
          description: Invalid slug
        "401":
          description: Pro tier required
        "409":
          description: Slug already exists

  /api/projects/{slug}/manifest/assembly-steps:
    put:
      tags: [projects]
      summary: Update assembly steps
      operationId: updateAssemblySteps
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assembly_steps:
                  type: array
                  items:
                    type: object
              required: [assembly_steps]
      responses:
        "200":
          description: Steps saved
        "400":
          description: Missing assembly_steps
        "404":
          description: Project not found

  # ── Legacy Manifest ────────────────────────────────────
  /api/manifest:
    get:
      tags: [manifest]
      summary: Get default manifest (legacy)
      operationId: getManifest
      deprecated: true
      responses:
        "200":
          description: Default project manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"

  /api/config:
    get:
      tags: [manifest]
      summary: Get config (legacy, delegates to manifest)
      operationId: getConfig
      deprecated: true
      responses:
        "200":
          description: Legacy config response
          content:
            application/json:
              schema:
                type: object

  # ── Render ──────────────────────────────────────────────
  /api/estimate:
    post:
      tags: [render]
      summary: Estimate render time
      operationId: estimateRenderTime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: Time estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"

  /api/render:
    post:
      tags: [render]
      summary: Synchronous render
      operationId: renderStl
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderRequest"
      responses:
        "200":
          description: Render complete
          headers:
            X-RateLimit-Limit:
              schema:
                type: string
            X-RateLimit-Tier:
              schema:
                type: string
            X-Cache:
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderResponse"
        "400":
          description: Invalid mode or SCAD file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Project is private and the caller is not entitled to it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectLocked"

  /api/render-stream:
    post:
      tags: [render]
      summary: Stream render via SSE
      operationId: renderStlStream
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderRequest"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE events: job, part_start, output, part_done, cancelled,
                  error, complete. Each `data:` line is a JSON object with an
                  `event` field and a `stream_protocol` version (1.1.0).

                  `job` carries `{request_id, job_ids}` — the render's
                  cancellation identity. It is sent once when the stream opens
                  (with an empty `job_ids`) and again as each part is queued,
                  carrying every job id issued so far. Pass either field to
                  `POST /api/render-cancel` to cancel this render and no other.

  /api/render-cancel:
    post:
      tags: [render]
      summary: Cancel a render by request_id or job_ids
      description: |
        Cancels only the jobs named in the body. Both identifiers are published
        on the caller's own `/api/render-stream` `job` event; holding one stands
        in for the ownership the render pipeline does not record, which is why
        this endpoint stays open to anonymous callers.

        `job_ids` are server-minted UUID4s and unguessable. `request_id` is
        caller-suppliable, so a caller that chooses a predictable one is
        choosing a predictable cancel handle. A `request_id` cancel also stops
        the parts of a multi-part render that have not been queued yet — job ids
        alone cannot, because parts are queued one at a time.

        `{"all": true}` cancels every render on the box and requires the `admin`
        role.

        The body is parsed as JSON regardless of its `Content-Type`. A page
        being unloaded can only reach this endpoint through
        `navigator.sendBeacon`, whose content type is whatever Blob it carries,
        and the shape that always crosses an origin without a preflight is
        `text/plain`. Only the header is tolerated — the body is still JSON and
        every field is validated identically, so `text/plain` grants no caller
        anything `application/json` would not.
      operationId: cancelRender
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderCancelRequest'
          # A JSON body sent by navigator.sendBeacon on page unload: same
          # schema, only the content type differs.
          text/plain:
            schema:
              $ref: '#/components/schemas/RenderCancelRequest'
      responses:
        "200":
          description: Cancel result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [cancelled, no_active_render]
                  cancelled:
                    type: boolean
                  cancelled_jobs:
                    type: array
                    items:
                      type: string
                    description: The job ids actually marked cancelled
                  request_id:
                    type: string
                    nullable: true
                  scope:
                    type: string
                    enum: [all]
                    description: 'Present only on an admin `{"all": true}` cancel'
        "400":
          description: |
            No cancel target (`cancel_target_required`), or a malformed one
            (`cancel_target_invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: '`{"all": true}` from an anonymous caller'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: '`{"all": true}` without the admin role'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Download ────────────────────────────────────────────
  /api/projects/{slug}/download/{file_format}/{filename}:
    get:
      tags: [download]
      summary: Download rendered or source artifact
      description: >
        Serves a rendered artifact (or, for `scad`, project source). Rendered
        formats are gated on the caller's tier `export_formats` list — the same
        check `/api/render` applies at generation time — so an artifact filename
        alone does not grant access to a format the tier may not export. `stl`
        is available to every tier, including anonymous callers.
      operationId: downloadArtifact
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: file_format
          in: path
          required: true
          schema:
            type: string
            enum:
              - stl
              - scad
              - 3mf
              - obj
              - off
              - step
              - glb
              - gltf
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: >
            Partial content, in response to a `Range` request. Served on both
            artifact-storage backends — the API streams object-storage
            artifacts rather than redirecting to them, so it answers the range
            itself.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: >
            Not modified — the caller's `If-None-Match` or `If-Modified-Since`
            still matches the stored artifact.
        "416":
          description: Requested range is not satisfiable for this artifact.
        "400":
          description: Unsupported file format
        "401":
          description: Authentication required
        "403":
          description: >
            File not in the manifest allowlist, or the export format requires a
            higher tier.
        "404":
          description: File not found

  /api/projects/{slug}/download/stl/{filename}:
    get:
      tags: [download]
      summary: Download STL file
      operationId: downloadStl
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
