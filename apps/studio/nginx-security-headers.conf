# Security headers for studio. Included at server level AND in every location
# that declares its own add_header: nginx drops ALL inherited add_header
# directives in a block that declares any, so a location that sets
# Cache-Control without this include serves no CSP / X-Frame-Options / nosniff
# (that is how app.yantra4d.com/ lost them). Installed at
# /etc/nginx/snippets/security-headers.conf by apps/studio/Dockerfile.
# scripts/tests/test_nginx_security_headers.py enforces the include rule.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS: TLS terminates at Cloudflare, which forwards this header to the browser.
# No preload: preload-list inclusion is a separate, hard-to-reverse decision.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.yantra4d.com https://auth.madfam.io https://yantra4d.com blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://yantra4d.com;" always;
