name: E2E Browser Audit (Nightly)

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC
  workflow_dispatch:       # Manual trigger

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start Docker stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build
          echo "Waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Backend failed to become healthy within 60s"
              docker compose -f docker-compose.dev.yml logs backend
              exit 1
            fi
            sleep 1
          done

      - name: Wait for Studio
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Studio ready after ${i}s"
              break
            fi
            if [ "$i" = "120" ]; then
              echo "::error::Studio failed to start within 120s"
              docker compose -f docker-compose.dev.yml logs studio
              exit 1
            fi
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json

      - name: Install studio dependencies
        working-directory: apps/studio
        run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-audit-${{ hashFiles('apps/studio/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: Run browser audit tests
        working-directory: apps/studio
        run: npx playwright test --project=audit
        env:
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-report-${{ github.run_id }}
          path: |
            apps/studio/playwright-report/
            apps/studio/test-results/
          retention-days: 30

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'e2e-audit-failure',
              state: 'open',
            });
            // Don't create duplicate issues
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Nightly audit failed again on ${today}. [Run #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `E2E Browser Audit failure — ${today}`,
              body: `The nightly browser audit (86 tests) failed.\n\n**Run:** [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\nCheck the Playwright report artifact for details.`,
              labels: ['e2e-audit-failure', 'bug'],
            });

      - name: Stop Docker stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
