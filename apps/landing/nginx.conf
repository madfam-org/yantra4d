# Origins allowed to read /models/ cross-origin: the Studio (app.yantra4d.com)
# shows the prerendered default mesh on project open, and a local Studio dev
# server does the same against this host. Every other origin gets no
# Access-Control-Allow-Origin (an empty add_header value is not sent).
# Included at http level (conf.d), which is where `map` must live.
map $http_origin $models_cors_origin {
    default "";
    "https://app.yantra4d.com" $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Crawl files (robots.txt, sitemap.xml, llms.txt) are real files from the
    # build. Without this block the SPA fallback above answered them, and any
    # missing .txt/.xml, with 200 text/html. A regex location wins over the `/`
    # prefix, so a missing one is now a real 404. mime.types already maps txt
    # to text/plain and xml to text/xml. `expires` only — an add_header here
    # would replace the inherited security headers.
    location ~* \.(txt|xml)$ {
        charset utf-8;
        expires 1h;
        try_files $uri =404;
    }

    # Generated JSON the gallery fetches on demand (per-locale commons list):
    # content-addressed by build, not by filename, so a short TTL rather than
    # immutable. `expires` alone — an add_header here would replace the
    # inherited security headers below.
    location ~* ^/data/.*\.json$ {
        expires 1h;
    }

    # The prerendered model manifest: the gallery reads it same-origin, the
    # Studio cross-origin (CORS for the origins in $models_cors_origin). Same
    # 1 h TTL as above. Declaring add_header drops the inherited security
    # headers, so the snippet is included again.
    location = /models/manifest.json {
        expires 1h;
        add_header Access-Control-Allow-Origin $models_cors_origin always;
        add_header Vary "Origin" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Prerendered meshes (<slug>.lod1.glb / .lod0.glb / keyframes): immutable
    # like every other .glb, plus CORS for the Studio. Listed before the generic
    # .glb location below because the first matching regex wins.
    location ~* ^/models/[^/]+\.glb$ {
        types { }
        default_type model/gltf-binary;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin $models_cors_origin always;
        add_header Vary "Origin" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Meshes. glb is missing from nginx's default mime.types; `types {}` scopes
    # the override to this location so the global table stays intact.
    location ~* \.glb$ {
        types { }
        default_type model/gltf-binary;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|stl|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Security headers (CSP, X-Frame-Options, nosniff, Referrer-Policy, HSTS).
    # Repeated in every location above that declares its own add_header.
    include /etc/nginx/snippets/security-headers.conf;
}
