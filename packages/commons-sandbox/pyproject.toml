[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madfam-commons-sandbox"
version = "1.0.0"
description = "Shared restricted-execution core for MADFAM hyperobject cartridge runners (Fashion Cabinet, Yantra4D)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Innovaciones MADFAM SAS de CV" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
