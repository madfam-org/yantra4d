apiVersion: enclii.dev/v1
kind: Service
metadata:
  name: yantra4d
  project: yantra4d
spec:
  status:
    enabled: true
    entries:
      - name: Yantra4D Web
        url: https://yantra4d.com
        group: Yantra4D
        family: Digital Fabrication
        description: 3D printing platform
      - name: Yantra4D Studio
        url: https://app.yantra4d.com
        group: Yantra4D
        family: Digital Fabrication
        description: 3D design studio
      - name: Yantra4D Admin
        url: https://admin.yantra4d.com
        # Do not pin a hashed asset here: the filename changes on every build,
        # so the probe 404s and `assertNotContains` then passes vacuously
        # against an error page. The bundle is checked for leaked localhost
        # URLs at build time instead (see the admin job in ci.yml).
        probeUrl: https://admin.yantra4d.com/
        group: Yantra4D
        family: Digital Fabrication
        description: Print operations console
  domains:
    - name: yantra4d.com
      environment: production
      port: 80
    - name: api.yantra4d.com
      environment: production
      port: 80
    - name: app.yantra4d.com
      environment: production
      port: 80
    - name: admin.yantra4d.com
      environment: production
      port: 80
  runtime:
    port: 5000
  network:
    services:
      - name: yantra4d-landing
        port: 80
        ingress: [cloudflare-tunnel]
        egress: [dns]
      - name: yantra4d-backend
        port: 5000
        ingress: [cloudflare-tunnel]
        egress: [dns, https, postgres]
      - name: yantra4d-studio
        port: 80
        ingress: [cloudflare-tunnel]
        egress: [dns, https]
      - name: yantra4d-admin
        port: 80
        ingress: [cloudflare-tunnel]
        egress: [dns, https]
      - name: yantra4d-redis
        port: 0
        egress: [dns]
      # Now a real Deployment rather than a sidecar in the backend pod, so this
      # peer finally describes something that exists on its own. port 0: the
      # worker has no listener and no Service — it pulls jobs from the Redis
      # list and publishes results back over pub/sub.
      #
      # Egress narrowed to dns (to resolve yantra4d-redis) plus the explicit
      # render-worker-to-redis rule below. The worker's import graph contains
      # no HTTP client at all, and while flask_sqlalchemy is pulled in
      # transitively via `extensions`, the worker never initialises an app or
      # opens a session — so https and postgres were reachability it never
      # used. If a future render path does need either, add it back here.
      - name: yantra4d-render-worker
        port: 0
        egress: [dns]
    custom:
      - name: landing-to-backend
        from: { app: yantra4d-landing }
        to: { app: yantra4d-backend }
        port: 5000
        direction: both
      - name: studio-to-backend
        from: { app: yantra4d-studio }
        to: { app: yantra4d-backend }
        port: 5000
        direction: both
      - name: admin-to-backend
        from: { app: yantra4d-admin }
        to: { app: yantra4d-backend }
        port: 5000
        direction: both
      - name: backend-to-redis
        from: { app: yantra4d-backend }
        to: { app: yantra4d-redis }
        port: 6379
        direction: both
      - name: render-worker-to-redis
        from: { app: yantra4d-render-worker }
        to: { app: yantra4d-redis }
        port: 6379
        direction: both
