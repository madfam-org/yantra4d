apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yantra4d

resources:
- namespace.yaml
- yantra4d-backend-deployment.yaml
- yantra4d-backend-service.yaml
- yantra4d-studio-deployment.yaml
- yantra4d-studio-service.yaml
- yantra4d-landing-deployment.yaml
- yantra4d-landing-service.yaml
- yantra4d-admin-deployment.yaml
- yantra4d-admin-service.yaml
- yantra4d-analytics-pvc.yaml
- yantra4d-redis-pvc.yaml
- yantra4d-redis-deployment.yaml
- yantra4d-redis-service.yaml

images:
- digest: sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
  name: docker.io/library/redis
  newName: docker.io/library/redis
- digest: sha256:bbb3b42c494295518d5c5237597f09df4aa5b13c1e8ed9d42b59b7764194696b
  name: ghcr.io/madfam-org/yantra4d/admin
  newName: ghcr.io/madfam-org/yantra4d/admin
- digest: sha256:f60f27691e65744671927fd4538f12ae0b3b2367385821d34cbc1fd787e26e8f
  name: ghcr.io/madfam-org/yantra4d/backend
  newName: ghcr.io/madfam-org/yantra4d/backend
- digest: sha256:8b9f0bc6671f316f99444561f64ae2623b6ba533f78c34c7be7cf5a09312ff1e
  name: ghcr.io/madfam-org/yantra4d/landing
  newName: ghcr.io/madfam-org/yantra4d/landing
- digest: sha256:3c8653a83fc903bfc6d1eb88b64711494294c1efc2306304e02866edc1418b2f
  name: ghcr.io/madfam-org/yantra4d/studio
  newName: ghcr.io/madfam-org/yantra4d/studio

# A singleton Redis must release its writable PVC before its replacement starts.
# Server-side apply retained the live rollingUpdate during this transition.
# Replace only this complete Deployment so Recreate can remove those fields.
patches:
- patch: |-
    - op: add
      path: /spec/strategy
      value:
        type: Recreate
        rollingUpdate: null
  target:
    kind: Deployment
    name: yantra4d-redis
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: yantra4d-redis
      annotations:
        argocd.argoproj.io/sync-options: Replace=true
