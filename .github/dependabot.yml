# Dependabot version updates (A1 D-9/D-10, 2026-10-18).
#
# - github-actions keeps the commit-SHA pins in .github/ fresh: Dependabot
#   rewrites the SHA and the trailing `# vN` comment together.
# - npm / pip: one grouped PR per directory per week for minor + patch bumps.
#   Majors are ignored for version updates until the owner rules otherwise
#   (the first run on 2026-10-18 opened 29 PRs at once); security updates
#   still open their own PRs, majors included.
# - Security updates (the Dependabot alerts) are separate from this file and
#   keep opening their own PRs as soon as an advisory lands.
#
# Weekly on Monday morning, America/Mexico_City (the operating timezone).
# YAML anchors are avoided on purpose: each entry is spelled out in full.
version: 2

updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the composite action needs its own entry.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Mexico_City
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors wait for a ruling (2026-10-18): the first run opened 29 PRs at once. Security updates are unaffected.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

