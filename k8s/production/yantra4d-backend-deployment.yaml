apiVersion: apps/v1
kind: Deployment
metadata:
  name: yantra4d-backend
  labels:
    app.kubernetes.io/name: yantra4d-backend
    app.kubernetes.io/part-of: yantra4d
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: yantra4d-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yantra4d-backend
        app.kubernetes.io/part-of: yantra4d
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/madfam-org/yantra4d/backend
          imagePullPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: FLASK_DEBUG
              value: "false"
            - name: PORT
              value: "5000"
            - name: REDIS_URL
              value: "redis://yantra4d-redis:6379/0"
            - name: RATE_LIMIT_STORAGE
              value: "redis://yantra4d-redis:6379/1"
            - name: CORS_ORIGINS
              value: "https://app.yantra4d.com,https://yantra4d.com,https://admin.yantra4d.com"
            - name: AUTH_ENABLED
              value: "true"
            - name: JANUA_ISSUER
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: JANUA_ISSUER
            - name: JANUA_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: JANUA_AUDIENCE
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: AI_API_KEY
                  optional: true
            - name: COTIZA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: COTIZA_WEBHOOK_SECRET
                  optional: true
            - name: FORGESIGHT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: FORGESIGHT_WEBHOOK_SECRET
                  optional: true
            - name: MQTT_ENABLED
              value: "false"
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: PUBLIC_STUDIO_URL
              value: "https://app.yantra4d.com"
            - name: ANALYTICS_DB_PATH
              value: "/app/backend/data/.analytics.db"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: render-output
              mountPath: /app/backend/static
            - name: analytics-data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: render-output
          emptyDir:
            sizeLimit: 512Mi
        - name: analytics-data
          persistentVolumeClaim:
            claimName: yantra4d-analytics
