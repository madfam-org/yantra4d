name: Deploy to K8s (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      # The render worker ships inside the backend image
      # (apps/api/Dockerfile: `COPY apps/worker/ /app/worker/`), so a
      # worker-only change is a backend image change. Without this the
      # workflow never starts and the new worker code never reaches the
      # cluster.
      - 'apps/worker/**'
      - 'apps/studio/**'
      - 'apps/landing/**'
      - 'apps/admin/**'
      - 'projects/**'
      - 'libs/**'
      - 'packages/**'
      - '!k8s/production/kustomization.yaml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment of all services'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: madfam-org/yantra4d

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Every job below picks its runner the same way: the repository variable
# DEPLOY_RUNNER_LABEL when the operator has set one, otherwise the shared pool
# madfam-runners-blue this workflow has always used.
#
# Why: a production deploy and a pull request's ten-shard browser matrix compete
# for the same pool, and the deploy loses. On 2026-09-02 deploy #540's Build
# Studio was queued from 04:01Z past 04:30Z behind roughly a hundred PR shard
# jobs, and because this workflow's concurrency group is serial by design
# (cancel-in-progress: false), deploy #542 then waited behind #540 — a shipping
# path held up for close to an hour by work that cannot block shipping.
# ci.yml's docs-only path filter removes a large share of that PR load; this
# gives the operator the second lever, a small dedicated runner set deploys own,
# without another change to this file.
#
# The shape follows ADR-010 (internal-devops decisions/): an operator-supplied
# override in front of the canonical arm, the same superset form the enclii
# reusable build-publish.yml uses for `inputs.build_runner`. Both arms are
# MADFAM-operated runners — this workflow has no GitHub-hosted fallback and
# gains none here, which is stricter than ADR-010 requires, not looser.
#
# Unset or empty resolves to madfam-runners-blue, so today's behaviour is
# unchanged until the variable exists. The variable holds ONE runner label.

# ---------------------------------------------------------------------------
# Change detection is measured from the LAST SUCCESSFUL DEPLOY, not from the
# previous push.
#
# This workflow's concurrency group is serial on purpose (cancel-in-progress:
# false, #84), and GitHub holds at most ONE pending run per group: a third push
# REPLACES the queued second one, which then never runs. Per-push detection is
# therefore unsafe here — the commits of a replaced run are examined by nobody.
# On 2026-09-02 merges #541 → #542 → #543 landed back to back, each replacing
# the pending run; the surviving run's filter saw only #543, which touched the
# backend alone, so the Studio image #542 needed was never built and production
# kept serving the previous Studio. The operator recovered it by hand with
# workflow_dispatch + force_deploy=true.
#
# `base` is resolved by scripts/ci/last_successful_deploy_sha.sh (tested in
# scripts/ci/tests/) from this workflow's own run history:
# GET /actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1
# → head_sha, using the job's GITHUB_TOKEN with `actions: read`. A dropped run
# is then harmless: the next run still diffs every path changed since the last
# commit that actually shipped. A run that failed is not "successful", so its
# commits stay inside the next run's diff and get rebuilt — the safe direction.
#
# When the lookup fails — first deploy, empty history, HTTP or transport error,
# unparseable response, a head_sha that is not a 40-character SHA — the script
# exits non-zero and this workflow FAILS CLOSED TO BUILDING EVERY SERVICE, says
# so in the job summary and raises a warning annotation. An unresolved base is
# never read as "nothing changed": a silent no-op deploy is the defect above.
# workflow_dispatch with force_deploy=true still builds everything and skips the
# lookup entirely.
#
# Digest commits do not loop: `deploy(yantra4d): update digests` touches only
# k8s/production/kustomization.yaml, which matches no trigger path above (so the
# workflow does not start) and no filter below (so even when it rides along
# inside a later diff it builds nothing).
# ---------------------------------------------------------------------------

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    permissions:
      contents: read
      # Reading this workflow's own run history to find the last successful
      # deploy is an Actions API call, not a contents one. Nothing here writes.
      actions: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      studio: ${{ steps.decide.outputs.studio }}
      landing: ${{ steps.decide.outputs.landing }}
      admin: ${{ steps.decide.outputs.admin }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The base is an older commit on main than the one being deployed
          # and the filter diffs `base..HEAD` against it. A depth-1 checkout
          # does not contain it: the action would fall back to fetching that
          # single SHA shallowly, and a fetch that fails is a hard error in the
          # middle of a deploy. Full history keeps the diff a local operation.
          # No submodules are checked out here — this job only reads paths.
          fetch-depth: 0

      - name: Resolve the change-detection base
        id: base
        # force_deploy builds everything regardless, so do not spend an API call
        # (or risk a confusing warning) on a base nothing will read.
        if: github.event.inputs.force_deploy != 'true'
        env:
          # github.token, scoped by this job's `actions: read` above. The script
          # reads GITHUB_REPOSITORY and GITHUB_API_URL from the runner.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          reason_file="${RUNNER_TEMP:-/tmp}/deploy-base-reason.txt"
          status=0
          sha="$(scripts/ci/last_successful_deploy_sha.sh 2>"$reason_file")" || status=$?
          reason="$(cat "$reason_file" 2>/dev/null || true)"

          if [ "$status" -eq 0 ] && [ -n "$sha" ]; then
            {
              echo "sha=$sha"
              echo "build_everything=false"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### Change detection"
              echo
              echo "Base: last successful deploy \`$sha\` — not the previous push."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Fail closed. Everything gets built, and the reason is on the run
            # page rather than in a log nobody opens.
            {
              echo "sha="
              echo "build_everything=true"
            } >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy base unresolved::Building every service. ${reason:-no reason reported}"
            {
              echo "### Change detection"
              echo
              echo "**The last successful deploy could not be resolved, so every service is built.**"
              echo
              echo '```'
              echo "${reason:-no reason reported}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Path filter
        id: filter
        # Runs only when the base step answered with a usable SHA. A skipped or
        # unresolved base leaves this step out and the next one builds
        # everything — never the other way round.
        if: steps.base.outputs.build_everything == 'false'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            backend:
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'projects/**'
              - 'libs/**'
              - 'packages/schemas/**'
            studio:
              - 'apps/studio/**'
              - 'packages/**'
            landing:
              - 'apps/landing/**'
              - 'packages/**'
            admin:
              - 'apps/admin/**'
              - 'packages/**'

      - name: Decide what to build
        id: decide
        env:
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
          BUILD_EVERYTHING: ${{ steps.base.outputs.build_everything }}
          FILTER_BACKEND: ${{ steps.filter.outputs.backend }}
          FILTER_STUDIO: ${{ steps.filter.outputs.studio }}
          FILTER_LANDING: ${{ steps.filter.outputs.landing }}
          FILTER_ADMIN: ${{ steps.filter.outputs.admin }}
        run: |
          set -euo pipefail

          # Only a filter that actually ran and answered exactly "false" skips a
          # build. An empty value — the step was skipped, the action changed its
          # contract — is read as "build it".
          skip_unless_false() {
            if [ "${1:-}" = "false" ]; then echo false; else echo true; fi
          }

          if [ "${FORCE_DEPLOY:-}" = "true" ]; then
            reason="workflow_dispatch with force_deploy=true"
            backend=true; studio=true; landing=true; admin=true
          elif [ "${BUILD_EVERYTHING:-}" != "false" ]; then
            reason="the change-detection base could not be resolved (see above)"
            backend=true; studio=true; landing=true; admin=true
          else
            reason="paths changed since the last successful deploy"
            backend="$(skip_unless_false "${FILTER_BACKEND:-}")"
            studio="$(skip_unless_false "${FILTER_STUDIO:-}")"
            landing="$(skip_unless_false "${FILTER_LANDING:-}")"
            admin="$(skip_unless_false "${FILTER_ADMIN:-}")"
          fi

          {
            echo "backend=$backend"
            echo "studio=$studio"
            echo "landing=$landing"
            echo "admin=$admin"
          } >> "$GITHUB_OUTPUT"

          {
            echo
            echo "Building ($reason):"
            echo
            echo "| service | build |"
            echo "| --- | --- |"
            echo "| backend | $backend |"
            echo "| studio | $studio |"
            echo "| landing | $landing |"
            echo "| admin | $admin |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-backend:
    name: Build Backend
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event.inputs.force_deploy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}

      # The client-private cartridges are `update = none` submodules, which the
      # recursive checkout above skips even with the PAT, so until now the
      # backend image never contained them and /api/projects/tablaco was a 404
      # in production. They are served only to authorized identities
      # (PRIVATE_PROJECTS / access_control.view = private, see docs/AUTH.md),
      # and the GHCR image is private, so they belong in this image. Only the
      # cartridges listed here are pulled in; `--checkout` is git's documented
      # override for `update = none`.
      - name: Init client-private cartridges
        env:
          MADFAM_BOT_PAT: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          set -euo pipefail
          for path in projects/tablaco; do
            git -c "url.https://x-access-token:${MADFAM_BOT_PAT}@github.com/.insteadOf=https://github.com/" \
              submodule update --init --checkout --depth 1 "$path"
            test -f "$path/project.json" || { echo "::error::$path/project.json missing after init"; exit 1; }
            echo "initialised $path"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.13.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: madfam-bot
          password: ${{ secrets.MADFAM_BOT_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend
          tags: |
            type=sha,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend,ignore-error=true
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true
          provenance: false
          sbom: false

      - name: Install cosign (checksum binary — the installer action dies on ARC runners)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Retry: 2026-08-26 crea-frontend run 33010085743 lost a deploy when
      # GitHub's OIDC endpoint returned non-JSON ("invalid character 'u'") and
      # cosign died. Image was pushed, digest never pinned, ArgoCD never rolled.
      - name: Sign image with cosign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

  build-studio:
    name: Build Studio
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.studio == 'true' || github.event.inputs.force_deploy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.13.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: madfam-bot
          password: ${{ secrets.MADFAM_BOT_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/studio
          tags: |
            type=sha,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/studio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=studio,ignore-error=true
          cache-to: type=gha,scope=studio,mode=max,ignore-error=true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_BASE=https://api.yantra4d.com
            VITE_JANUA_BASE_URL=${{ secrets.JANUA_BASE_URL }}
            VITE_JANUA_CLIENT_ID=${{ secrets.JANUA_CLIENT_ID }}
            VITE_JANUA_REDIRECT_URI=https://app.yantra4d.com
            VITE_DHANAM_CHECKOUT_URL=https://app.dhan.am/checkout
            NPM_MADFAM_TOKEN=${{ secrets.NPM_MADFAM_TOKEN }}

      - name: Install cosign (checksum binary — the installer action dies on ARC runners)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Retry: 2026-08-26 crea-frontend run 33010085743 lost a deploy when
      # GitHub's OIDC endpoint returned non-JSON ("invalid character 'u'") and
      # cosign died. Image was pushed, digest never pinned, ArgoCD never rolled.
      - name: Sign image with cosign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/studio@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

  build-landing:
    name: Build Landing
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.landing == 'true' || github.event.inputs.force_deploy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      # Submodules were NOT checked out here until now, which is precisely why
      # the gallery could ship a stale list: 36 of the cartridges live in
      # submodules, so this job never had the data to notice. `recursive` +
      # the PAT brings the public ones in; the client-private cartridges are
      # `update = none` and git skips them even recursively, so they stay out
      # of the landing image (`--checkout`, the documented override, is
      # deliberately NOT used here — unlike build-backend, whose private image
      # is meant to serve them).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Regenerate rather than only --check.
      #
      # `apps/landing/src/data/projects.ts` is generated from projects/*/project.json
      # and committed. Checking it here would make a stale commit fail the deploy;
      # regenerating makes the deployed gallery correct by construction and demotes
      # the committed file to a fallback for local dev and for the `landing` CI job
      # (which has no submodules). The drift gate still exists — ci.yml's
      # manifest-validation job runs `--check` on every PR — so a stale commit is
      # caught before merge, and this step means a stale commit can never *ship*.
      #
      # The landing Dockerfile copies only `apps/landing/` and `packages/`, so this
      # has to run on the runner, before the build context is sent: `projects/` is
      # never inside the image.
      #
      # Fail-closed: no --allow-partial. If a public cartridge submodule failed to
      # check out, the generator exits 2 and the deploy stops rather than publishing
      # a gallery that silently under-reports the commons.
      - name: Regenerate landing project list from the manifests
        run: |
          set -euo pipefail
          node scripts/dev/generate-landing-projects.mjs
          if git diff --quiet -- apps/landing/src/data/projects.ts; then
            echo "committed projects.ts already matched the manifests" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::committed projects.ts was stale — regenerated for this build" \
              "(run \`npm run gen:projects\` from apps/landing and commit the result)"
            {
              echo "### Landing project list was stale"
              echo '```'
              git diff --stat -- apps/landing/src/data/projects.ts
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.13.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: madfam-bot
          password: ${{ secrets.MADFAM_BOT_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/landing
          tags: |
            type=sha,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/landing/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=landing,ignore-error=true
          cache-to: type=gha,scope=landing,mode=max,ignore-error=true
          provenance: false
          sbom: false
          build-args: |
            PUBLIC_STUDIO_URL=https://app.yantra4d.com

      - name: Install cosign (checksum binary — the installer action dies on ARC runners)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Retry: 2026-08-26 crea-frontend run 33010085743 lost a deploy when
      # GitHub's OIDC endpoint returned non-JSON ("invalid character 'u'") and
      # cosign died. Image was pushed, digest never pinned, ArgoCD never rolled.
      - name: Sign image with cosign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/landing@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

  build-admin:
    name: Build Admin
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true' || github.event.inputs.force_deploy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.13.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: madfam-bot
          password: ${{ secrets.MADFAM_BOT_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/admin
          tags: |
            type=sha,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin,ignore-error=true
          cache-to: type=gha,scope=admin,mode=max,ignore-error=true
          provenance: false
          sbom: false
          build-args: |
            VITE_API_BASE=https://api.yantra4d.com
            VITE_JANUA_BASE_URL=${{ secrets.JANUA_BASE_URL }}
            VITE_JANUA_CLIENT_ID=jnc_-v2RiP_TMO-XSExftpCh41K46xeszlKh
            VITE_JANUA_REDIRECT_URI=https://admin.yantra4d.com
            VITE_AUTH_ENABLED=true
            NPM_MADFAM_TOKEN=${{ secrets.NPM_MADFAM_TOKEN }}

      - name: Install cosign (checksum binary — the installer action dies on ARC runners)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Retry: 2026-08-26 crea-frontend run 33010085743 lost a deploy when
      # GitHub's OIDC endpoint returned non-JSON ("invalid character 'u'") and
      # cosign died. Image was pushed, digest never pinned, ArgoCD never rolled.
      - name: Sign image with cosign
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/admin@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          signed=0
          for wait in 0 20 60; do
            if [ "$wait" -gt 0 ]; then
              echo "::warning::cosign sign failed for ${IMAGE_REF} (transient OIDC/Fulcio/Rekor?); retrying in ${wait}s..."
              sleep "$wait"
            fi
            if cosign sign --yes "${IMAGE_REF}"; then
              signed=1
              break
            fi
          done
          if [ "$signed" -ne 1 ]; then
            echo "::error::cosign sign failed 3 times for ${IMAGE_REF}."
            echo "::error::The image was BUILT AND PUSHED but is NOT signed, so it will not be"
            echo "::error::pinned and ArgoCD will not roll it: the live host is still serving the"
            echo "::error::PREVIOUS build even though this commit is on main. Rerun the failed jobs."
            exit 1
          fi

  commit-digests:
    name: Commit Image Digests
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    needs: [detect-changes, build-backend, build-studio, build-landing, build-admin]
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
      (needs.build-studio.result == 'success' || needs.build-studio.result == 'skipped') &&
      (needs.build-landing.result == 'success' || needs.build-landing.result == 'skipped') &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-backend.outputs.image_digest != '' || needs.build-studio.outputs.image_digest != '' || needs.build-landing.outputs.image_digest != '' || needs.build-admin.outputs.image_digest != '')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MADFAM_BOT_PAT }}

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Commit image digests
        run: |
          git config user.name "madfam-bot"
          git config user.email "bot@madfam.dev"

          BACKEND_DIGEST="${{ needs.build-backend.outputs.image_digest }}"
          STUDIO_DIGEST="${{ needs.build-studio.outputs.image_digest }}"
          LANDING_DIGEST="${{ needs.build-landing.outputs.image_digest }}"
          ADMIN_DIGEST="${{ needs.build-admin.outputs.image_digest }}"

          for ATTEMPT in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            cd k8s/production

            if [ -n "$BACKEND_DIGEST" ]; then
              kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend@${BACKEND_DIGEST}
            fi
            if [ -n "$STUDIO_DIGEST" ]; then
              kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/studio=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/studio@${STUDIO_DIGEST}
            fi
            if [ -n "$LANDING_DIGEST" ]; then
              kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/landing=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/landing@${LANDING_DIGEST}
            fi
            if [ -n "$ADMIN_DIGEST" ]; then
              kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/admin=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/admin@${ADMIN_DIGEST}
            fi

            cd ../..

            git add k8s/production/kustomization.yaml
            git diff --staged --quiet && echo "No changes to commit" && exit 0
            git commit -m "deploy(yantra4d): update digests to ${GITHUB_SHA::8}"
            git push origin main && exit 0
            echo "Retry $ATTEMPT..."
            sleep $((ATTEMPT * 2))
          done
          echo "Failed after 3 attempts"
          exit 1

  verify-deploy:
    name: Post-Deploy Health Check
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    needs: [commit-digests]
    # always() is load-bearing: on a push that builds only one service the other
    # build jobs are skipped, and GitHub propagates "skipped" down the needs
    # chain to every dependent that does not use a status-check function — so
    # without it this job was skipped on every backend-only deploy even though
    # commit-digests had succeeded (deploy #547, 2026-09-02).
    if: always() && needs.commit-digests.result == 'success'
    steps:
      - name: Wait for backend health
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.yantra4d.com/api/health)
            [ "$STATUS" = "200" ] && echo "Backend healthy" && exit 0
            echo "Attempt $i: status=$STATUS, retrying in 30s..."
            sleep 30
          done
          echo "Backend health check failed after 6 minutes"
          exit 1

  lifecycle-events:
    name: Report Lifecycle Events
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL != '' && vars.DEPLOY_RUNNER_LABEL || 'madfam-runners-blue' }}
    needs: [build-backend, build-studio, build-landing, build-admin]
    if: always()
    steps:
      - name: Report backend event
        if: needs.build-backend.result == 'success' || needs.build-backend.result == 'failure'
        run: |
          if [ "${{ needs.build-backend.result }}" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/yantra4d\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"yantra4d-backend ${EVENT_TYPE} (digest: ${{ needs.build-backend.outputs.image_digest }})\",
              \"metadata\": {
                \"service\": \"yantra4d-backend\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend\",
                \"digest\": \"${{ needs.build-backend.outputs.image_digest }}\",
                \"workflow\": \"deploy\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true

      - name: Report studio event
        if: needs.build-studio.result == 'success' || needs.build-studio.result == 'failure'
        run: |
          if [ "${{ needs.build-studio.result }}" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/yantra4d\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"yantra4d-studio ${EVENT_TYPE} (digest: ${{ needs.build-studio.outputs.image_digest }})\",
              \"metadata\": {
                \"service\": \"yantra4d-studio\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/studio\",
                \"digest\": \"${{ needs.build-studio.outputs.image_digest }}\",
                \"workflow\": \"deploy\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true

      - name: Report landing event
        if: needs.build-landing.result == 'success' || needs.build-landing.result == 'failure'
        run: |
          if [ "${{ needs.build-landing.result }}" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/yantra4d\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"yantra4d-landing ${EVENT_TYPE} (digest: ${{ needs.build-landing.outputs.image_digest }})\",
              \"metadata\": {
                \"service\": \"yantra4d-landing\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/landing\",
                \"digest\": \"${{ needs.build-landing.outputs.image_digest }}\",
                \"workflow\": \"deploy\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true

      - name: Report admin event
        if: needs.build-admin.result == 'success' || needs.build-admin.result == 'failure'
        run: |
          if [ "${{ needs.build-admin.result }}" = "success" ]; then
            EVENT_TYPE="image_pushed"
          else
            EVENT_TYPE="build_failed"
          fi
          curl -s -X POST "https://api.enclii.dev/v1/callbacks/lifecycle-event" \
            -H "Authorization: Bearer ${{ secrets.ENCLII_CALLBACK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo_full_name\": \"madfam-org/yantra4d\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"ref\": \"${{ github.ref }}\",
              \"event_type\": \"${EVENT_TYPE}\",
              \"source\": \"ci_callback\",
              \"message\": \"yantra4d-admin ${EVENT_TYPE} (digest: ${{ needs.build-admin.outputs.image_digest }})\",
              \"metadata\": {
                \"service\": \"yantra4d-admin\",
                \"image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/admin\",
                \"digest\": \"${{ needs.build-admin.outputs.image_digest }}\",
                \"workflow\": \"deploy\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || true
