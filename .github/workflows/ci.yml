name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job below runs on the shared self-hosted pool (madfam-runners-blue), and
# the e2e matrix alone is ten shards. Without a concurrency group, each push to
# an open PR stacked a full new run on the pool while the superseded run kept
# going — on 2026-09-02 four open PRs queued 20–60 min per job for that reason.
# One group per PR (or per ref for pushes): a new PR head cancels the run it
# supersedes; pushes to main never cancel each other, so every merged commit
# still gets its own complete run. deploy.yml has the same shape.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Round two of the CI economics work #84 started. #84 stopped a *superseded*
  # run from burning the pool; this stops a run that never needed to exist.
  # Every job below used to run on every pull request, so a README-only change
  # queued the full ten-shard browser matrix — ten jobs with a 30 minute cap
  # each — on the same shared pool a production deploy waits in. On 2026-09-02
  # deploy #540's Build Studio sat queued from 04:01Z past 04:30Z behind roughly
  # a hundred PR shard jobs, and deploy #542 waited behind #540 in the deploy
  # concurrency group.
  #
  # docs-only means EVERY changed file is documentation: any `*.md`, `docs/**`,
  # `apps/docs/**` (the Starlight docs site, which no job here builds),
  # `runbooks/**`, `.github/*.md`. A pull request that touches documentation AND
  # code is code.
  #
  # `predicate-quantifier: every` is load-bearing and not the default. Each list
  # entry is compiled into its own matcher; the default `some` quantifier reports
  # a file as `code` when it matches ANY entry, so `'**'` alone would match
  # everything and the negations would do nothing. With `every`, a file is `code`
  # only when it matches `'**'` AND none of the docs patterns exclude it, and the
  # filter output is true as soon as ONE such file is in the diff. The failure
  # direction is therefore a docs-only pull request classified as code, which
  # runs the matrix it already runs today — there is no arrangement of these
  # patterns that lets a code change skip the matrix.
  #
  # Only pull requests are classified. A push to main always reports code=true:
  # main is what deploy.yml builds from, and `github.event.before` is unreliable
  # across force pushes and first pushes, so every merged commit keeps its full
  # run.
  changes:
    runs-on: madfam-runners-blue
    timeout-minutes: 5
    permissions:
      contents: read
      # On a pull_request event the action lists the PR's files through the API
      # instead of cloning, so this job needs no checkout — and it must not fall
      # back to a diff it cannot compute.
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        # Pinned to the commit the v3 tag resolves to (v3.0.4). deploy.yml still
        # tracks the mutable `v3` tag; pinning is the direction to move in, not a
        # disagreement with that job.
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!apps/docs/**'
              - '!runbooks/**'
              - '!.github/*.md'

      - name: Classify
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
        # Fails closed on purpose: only a filter that actually ran and answered
        # exactly "false" skips anything. An empty output (the step was skipped,
        # the action changed its contract, the event is not a pull request) is
        # read as code.
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$FILTER_CODE" = "false" ]; then
            code=false
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "Changed paths include code — the full CI matrix runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Docs-only change — the browser matrix, the app builds, the backend suite and geometric parity are skipped. Manifest, metadata, licence, OpenAPI and spec-conformance checks still run." >> "$GITHUB_STEP_SUMMARY"
          fi

  studio:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: madfam-runners-blue
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      # Blocking: anything that reaches a user's browser.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev
      # Advisory: build-time tooling (vite, vitest, astro) never ships, so a CVE
      # there must not block a deploy — but it stays visible in the log.
      - name: Audit build tooling (advisory)
        run: npm audit --audit-level=high || true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Check bundle size
        run: |
          npm run build
          # This step had never actually run: the coverage step above it failed
          # first for long enough that the job always stopped before reaching
          # here, so the gate was never exercised against a real build. When it
          # finally did run it reported 16 MB against a 2 MB limit.
          #
          # Two things were wrong with the old `du -cb dist/assets/*.js`.
          #
          # It measured uncompressed bytes on disk rather than what a visitor
          # downloads, and it summed every lazily-loaded chunk — so the more the
          # app code-split, the worse it scored, which is backwards.
          #
          # And 13 MB of that 16 MB is one file: the OpenSCAD WASM engine. It is
          # constructed as `new Worker(new URL('./openscad-worker.js', ...))`
          # inside a memoised promise, so it is fetched on the first in-browser
          # render, not at page load. Counting it against a page-weight budget
          # measures something no first-time visitor pays.
          #
          # The gate is therefore app JS, gzipped, against the unchanged 2MB
          # limit — ~851 KB today. The engine is printed alongside so its size
          # stays visible rather than quietly excluded.
          APP=$(for f in dist/assets/*.js; do case "$f" in *openscad-worker*) continue ;; esac; gzip -c "$f" | wc -c; done | awk '{s+=$1} END {print s+0}')
          ENGINE=$(for f in dist/assets/*openscad-worker*.js; do gzip -c "$f" | wc -c; done 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "App JS transfer size (gzipped):  $(( APP / 1024 )) KB   [limit 2048 KB]"
          echo "OpenSCAD WASM engine (gzipped):  $(( ENGINE / 1024 )) KB   [lazy: fetched on first in-browser render]"
          if [ "$APP" -gt 2097152 ]; then
            echo "::error::App JS transfer size ${APP} bytes (gzipped) exceeds 2MB limit"
            exit 1
          fi

  landing:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: madfam-runners-blue
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      # Blocking: anything that reaches a user's browser.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev
      # Advisory: build-time tooling (astro, sharp) never ships, so a CVE there
      # must not block a deploy — but it stays visible in the log.
      - name: Audit build tooling (advisory)
        run: npm audit --audit-level=high || true
      - run: npm run test:coverage
      - run: npm run build

  admin:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: madfam-runners-blue
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      # Blocking: anything that reaches a user's browser.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev --legacy-peer-deps
      # Advisory: build-time tooling (vite, vitest) never ships, so a CVE there
      # must not block a deploy — but it stays visible in the log.
      - name: Audit build tooling (advisory)
        run: npm audit --audit-level=high --legacy-peer-deps || true
      - run: npm run lint
      - run: npm run build
      # Assert the production auth endpoint was baked into the bundle. This
      # replaces a status probe pinned to a hashed asset filename, which 404'd
      # after the next build and silently stopped checking anything.
      #
      # Deliberately a positive assertion. Grepping for absence of "localhost:"
      # false-positives on @janua/react-sdk, which carries
      # `apiUrl = NEXT_PUBLIC_API_URL || "http://localhost:8000"` defaults —
      # inert here, because every call site passes apiUrl explicitly, and
      # NEXT_PUBLIC_* is a Next.js convention this Vite app never injects.
      - name: Assert production auth endpoint is baked in
        run: |
          if ! grep -rq "auth\.madfam\.io" dist/assets/ 2>/dev/null; then
            echo "::error::Built admin bundle does not reference auth.madfam.io — VITE_JANUA_BASE_URL may be misconfigured, leaving the SDK's localhost:8000 default in play"
            exit 1
          fi
          echo "Production auth endpoint present in built bundle."
      - run: npm run test:coverage

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: madfam-runners-blue
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # OCP (cadquery's kernel) dlopens libGL at import; the ARC runner image
      # ships without it, so cq_runner subprocesses died with "CadQuery is not
      # installed (libGL.so.1: cannot open shared object file)". The parity and
      # e2e-audit jobs never hit this only because their openscad apt install
      # pulls libGL transitively.
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 libxext6
      - run: pip install -r requirements.txt
      - name: Install the shared sandbox core (cq_runner imports it)
        run: pip install -e ../../packages/commons-sandbox
      - run: pip install ruff pip-audit
      - run: pip-audit --desc || true
      - run: ruff check .
      - run: pip install pytest pytest-cov
      - name: Check for pending migrations
        run: |
          cd $GITHUB_WORKSPACE/apps/api
          flask db upgrade
          flask db check
        env:
          FLASK_APP: app.py
          DATABASE_URL: sqlite:////tmp/yantra4d-ci-migrations.db
          PROJECTS_DIR: ${{ github.workspace }}/projects
      - name: Run backend tests
        run: cd $GITHUB_WORKSPACE/apps/api && pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Each desktop project runs 321 specs, and playwright.config.js pins CI to a
    # single worker, so a full pass takes ~38 min against the old 25 min cap. The
    # suite had never once reached the end: it was cancelled around test 212
    # every time, so nobody knew the real pass/fail total.
    #
    # Sharded three ways (~107 specs, ~13 min per shard) rather than raising the
    # worker count, which would run WebGL-heavy viewer specs concurrently on one
    # runner and trade a known problem for a flaky one. Mobile only matches the
    # responsive suite (28 specs, ~4 min) so it stays unsharded.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, shards: 3 }
          - { project: chromium, shard: 2, shards: 3 }
          - { project: chromium, shard: 3, shards: 3 }
          - { project: firefox,  shard: 1, shards: 3 }
          - { project: firefox,  shard: 2, shards: 3 }
          - { project: firefox,  shard: 3, shards: 3 }
          - { project: webkit,   shard: 1, shards: 3 }
          - { project: webkit,   shard: 2, shards: 3 }
          - { project: webkit,   shard: 3, shards: 3 }
          - { project: mobile,   shard: 1, shards: 1 }
    runs-on: madfam-runners-blue
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      # The Studio proxies /api and /static to localhost:5000 (vite.config.ts).
      # Without a backend every request proxy-errors, the specs retry until the
      # job hits its timeout, and the whole matrix reports red for a reason that
      # has nothing to do with the change under test.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          sudo apt-get update && sudo apt-get install -y openscad
          pip install -r requirements.txt
          pip install -e ../../packages/commons-sandbox   # cq_runner subprocess imports it
      - name: Start backend
        working-directory: apps/api
        env:
          PORT: "5000"
          FLASK_DEBUG: "false"
          AUTH_ENABLED: "false"
          PROJECTS_DIR: ${{ github.workspace }}/projects
        # Fails LOUDLY and as a *setup* error, distinct from a test failure, so
        # flake triage stays honest. Previously the only evidence a reader got
        # was the step's echoed script — grepping a failed run for "did not
        # become healthy within 60s" matches the echoed source line even on runs
        # where the backend came up fine (it did: "backend up after 4s"), which
        # is exactly how this gate got blamed for the 09-keyboard flake it had
        # nothing to do with.
        #
        # Also raised 60s -> 180s with a capped backoff. The gate was not the
        # cause here, but a fixed 60s budget on a contended shared ARC runner is
        # a latent flake of its own, and a dead process is now detected
        # immediately rather than waiting out the whole budget.
        run: |
          set -uo pipefail
          python app.py > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          deadline=$(( SECONDS + 180 ))
          delay=1
          until curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "::error title=E2E setup failed::backend process exited before serving /api/health (this is a HARNESS failure, not a test failure)"
              echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error title=E2E setup failed::backend did not serve /api/health within 180s (this is a HARNESS failure, not a test failure)"
              echo "--- backend.log ---"; cat "$RUNNER_TEMP/backend.log"
              kill "$backend_pid" 2>/dev/null || true
              exit 1
            fi
            sleep "$delay"
            (( delay < 5 )) && delay=$(( delay + 1 ))
          done
          echo "backend healthy after ${SECONDS}s"
      - name: Build studio
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('apps/studio/package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
      # Blob so the shards can be merged back into one report and one honest
      # total; a per-shard HTML report only tells you a third of the story. list
      # alongside it because blob alone writes nothing to stdout — the first cut
      # of this left each shard's log silent about which specs ran, which makes
      # triaging one shard harder than before sharding existed.
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=blob,list
        env:
          CI: true
      # if: always() stays — e2e-report merges these even when shards fail, and a
      # red suite is exactly when the total matters. Retention is 1 day because
      # the only consumer is the merge job in the same run; the merged HTML
      # report is what anyone reads afterwards. 5 projects x 3 shards is ~1,700
      # of these artifacts against the org quota for no post-run value.
      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/studio/blob-report/
          retention-days: 1
      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload visual regression diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/studio/test-results/**/*-diff.png
          retention-days: 14
          if-no-files-found: ignore

  # Merge the shards into one report. Without this the only figures available
  # are per-shard, and the suite's real pass/fail total stays unknown — which is
  # how ~70 failures sat unquantified behind a job that was always cancelled.
  # Runs even when shards fail, because a red suite is exactly when the total
  # matters.
  e2e-report:
    needs: [changes, e2e]
    # always() so a red suite still gets its merged total (that is the whole
    # point of this job), but there is nothing to merge when the matrix was
    # never scheduled.
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: madfam-runners-blue
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: apps/studio/all-blobs
          pattern: blob-*
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html,list ./all-blobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: apps/studio/playwright-report/
          # The one Playwright artifact worth keeping past the run. A week
          # covers the triage window without carrying a fortnight of reports.
          retention-days: 7

  test-geometric-parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: madfam-runners-blue
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: pip install -r requirements.txt
      - name: Install the shared sandbox core (cq_runner subprocess imports it)
        run: pip install -e ../../packages/commons-sandbox
      - name: Run Geometric Regression Parity Tests
        run: python3 tests/scripts/geometric_regression.py --tolerance 0.05

  manifest-sync:
    runs-on: madfam-runners-blue
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check manifest sync
        run: python3 scripts/qa/sync_fallback_manifest.py --check
      - name: Check commons catalog is current
        run: python3 scripts/qa/generate_commons_catalog.py --check
      - name: Check graph node catalog matches the engine
        run: python3 scripts/qa/generate_graph_catalog.py --check
      - name: Shared sandbox core has not drifted from its lock
        run: python3 scripts/qa/check_sandbox_sync.py
      - name: Commons-sandbox tests
        run: |
          pip install -e 'packages/commons-sandbox[dev]'
          pytest packages/commons-sandbox/tests -q

  # deploy.yml decides what to rebuild from a base resolved by a shell script
  # (scripts/ci/last_successful_deploy_sha.sh). A deploy that silently drops a
  # service is precisely the failure that script exists to prevent, so its
  # fail-closed contract is pinned here against recorded API fixtures — no
  # network, no submodules, a few seconds. It runs on docs-only pull requests
  # too: it costs nothing and it guards the machinery that skipping relies on.
  ci-scripts:
    runs-on: madfam-runners-blue
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy change-detection base resolver
        run: ./scripts/ci/tests/test_last_successful_deploy_sha.sh

  manifest-validation:
    runs-on: madfam-runners-blue
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      # Strict by design: a projects/<slug> submodule that checked out empty is
      # a FAILURE here, not a skip. The local escape hatch
      # (--allow-uninitialised-submodules) must never be set in this job — it is
      # the whole point of the check that a partial checkout cannot pass.
      - name: Validate Project Manifests
        run: python3 scripts/qa/validate_manifests.py
      # The other half of the Fashion Cabinet hardware bridge. FC vendors a
      # pinned slice of our catalog and resolves its notions against it, so its
      # CI has always known when we moved; ours knew nothing, and a parameter
      # rename here went red days later in someone else's repo. This lane reads
      # the vendored back-edge (which of our parameters their garments drive)
      # and resolves every linked claim against these same manifests, so a
      # rename that would break a cabinet object fails in the PR that makes it.
      # Offline and stdlib-only: no network, nothing to install.
      - name: Fashion Cabinet consumers back-edge resolves
        run: python3 scripts/qa/refresh_fc_consumers.py --check
      # scripts/tests/ had no CI home: test_ceq_coverage.py and
      # test_validate_manifests.py passed only on developer machines, which is
      # the same "green for the wrong reason" failure the suites themselves
      # exist to catch. It lands here rather than in a job of its own because
      # this job already has Python 3.12, a recursive checkout and the
      # jsonschema the manifest tests import, and it is already in
      # ci-success's needs. pytest is the only dependency the suite adds.
      - name: scripts/ test suite
        run: |
          pip install pytest
          python -m pytest scripts/tests -q

  # Locale key parity is a hard gate (a missing key ships untranslated UI); the
  # hardcoded-string count is a ratchet against scripts/qa/i18n_baseline.json,
  # so the existing backlog does not block unrelated work but adding to it does.
  # Its own job rather than a step in `studio`: it needs Python, not Node, and
  # it should fail in seconds instead of after a 15-minute build.
  i18n-audit:
    runs-on: madfam-runners-blue
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit studio i18n (locale parity + hardcoded-string ratchet)
        run: python3 scripts/qa/i18n_audit.py

  # The extracted commons bar (hyperobjects-spec, docs/P1B_ADOPTION.md): a third
  # party's "it passes" and CI's "it passes" become the same sentence.
  # BLOCKING since 2026-08-22: the 31 structural failures the bar found on day
  # one were remediated across 15 child repos and 2 in-repo cartridges (sweep
  # PR #50 — full commons at failures=0), so a failure here is a regression,
  # not backlog.
  spec-conformance:
    runs-on: madfam-runners-blue
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # [geometry] pulls cadquery 2.7 + trimesh for the --render pass below.
      - name: Install hyperobjects-spec
        run: pip install "hyperobjects-spec[geometry] @ git+https://x-access-token:${{ secrets.MADFAM_BOT_PAT }}@github.com/madfam-org/hyperobjects-spec.git@v0.1.1"
      - name: Structural conformance (full commons)
        run: |
          status=0
          y4d-spec check projects/*/ | tee spec-report.txt || status=$?
          echo "### y4d-spec structural" >> "$GITHUB_STEP_SUMMARY"
          tail -1 spec-report.txt >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # Renders only the cartridges this change touched: the full sweep is hours
      # (15-25s/part) and lives in spec-nightly.yml; per-PR the changed slice is
      # the strongest check per second spent (it caught hook-and-eye's dead
      # bra_tape dispatch, invisible in every structural lane).
      - name: Render conformance (changed cartridges)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git cat-file -e "$BASE" 2>/dev/null || BASE=$(git rev-parse HEAD~1)
          changed=$(git diff --name-only "$BASE"...HEAD -- projects/ | cut -d/ -f1,2 | sort -u)
          dirs=""
          for d in $changed; do
            [ -f "$d/project.json" ] && dirs="$dirs $d"
          done
          if [ -z "$dirs" ]; then
            echo "no cartridges changed — skipping renders"
            exit 0
          fi
          status=0
          y4d-spec check --render -v $dirs | tee render-report.txt || status=$?
          echo "### y4d-spec renders (changed)" >> "$GITHUB_STEP_SUMMARY"
          tail -1 render-report.txt >> "$GITHUB_STEP_SUMMARY"
          exit $status

  metadata-consistency:
    runs-on: madfam-runners-blue
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run metadata consistency audit
        run: python3 scripts/qa/compliance_audit.py --strict
      # Blocking. Every cartridge must declare the licence it actually ships,
      # client-private work must stay out of the published catalogue, and an
      # upstream copyleft fork must not be relabelled as CERN-OHL-W.
      - name: Audit cartridge licensing
        run: python3 scripts/qa/check_licenses.py --strict-all

  openapi-validation:
    runs-on: madfam-runners-blue
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator
      # Also rejects duplicate mapping keys, which PyYAML resolves silently
      # by keeping the last definition — the plain validator cannot see them.
      - run: python3 scripts/qa/check_openapi.py

  ai-integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: madfam-runners-blue
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Run AI integration tests
        run: pytest tests/integration/test_ai_integration.py -v --tb=short
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY_TEST }}

  # The single required status check on main. Every other job reports its own
  # result, but this is the one branch protection reads, so it has to be able to
  # say no in every case that matters.
  #
  # `if: always()` is what makes the path filter above safe. Without it, a job in
  # `needs` that is skipped — which is exactly what a docs-only pull request
  # produces — takes this job with it, and GitHub reports a dependent job that
  # never ran as *skipped*, which branch protection counts as passing. The same
  # hole was already open for failures: with the default `if: success()` a failed
  # `backend` left this check skipped rather than red.
  #
  # So this job always runs and decides for itself: `failure` or `cancelled`
  # anywhere in `needs` fails it, and `skipped` counts as passing. `cancelled` is
  # in there for the concurrency group added in #84 — a superseded run must not
  # report a green required check for work that stopped halfway.
  #
  # `manifest-sync` and `spec-conformance` are new to this list. Both already ran
  # on every pull request and spec-conformance's own comment calls itself
  # BLOCKING, but neither was in `needs`, so neither could actually block a merge
  # through the one required check. `e2e-report` is deliberately still out: it
  # merges shard reports after the fact, and a hiccup there should not block a
  # merge whose tests all passed.
  ci-success:
    if: always()
    needs:
      - changes
      - studio
      - landing
      - admin
      - backend
      - e2e
      - test-geometric-parity
      - manifest-sync
      - manifest-validation
      - ci-scripts
      - metadata-consistency
      - openapi-validation
      - spec-conformance
      - i18n-audit
    runs-on: madfam-runners-blue
    timeout-minutes: 5
    steps:
      - name: Dependency results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: printf '%s\n' "$NEEDS_JSON"
      - name: Fail if any dependency failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error title=CI failed::A required job reported failure or cancelled — see the Dependency results step above."
          exit 1
      - name: All checks passed
        run: echo "All CI checks passed. Jobs skipped by the docs-only path filter count as passed."
