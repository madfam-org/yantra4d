name: Update Submodules

on:
  schedule:
    - cron: '0 9 * * 1' # Weekly Monday 9am UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Update all submodules to latest
        run: |
          # Honors `update = none` in .gitmodules for any submodule that
          # ever needs to opt out — currently no submodules opt out.
          git submodule foreach '
            name=$(basename "$sm_path")
            mode=$(git config --file "$toplevel/.gitmodules" --get "submodule.$sm_path.update" 2>/dev/null || echo "")
            if [ "$mode" = "none" ]; then
              echo "Skipping $name (update = none)"
            else
              git fetch origin
              git checkout origin/main 2>/dev/null || git checkout origin/master 2>/dev/null || true
            fi
          '
      # Cartridge manifests just moved, so everything derived from them must be
      # regenerated in the same PR. Otherwise the weekly bump lands a stale
      # Studio fallback and catalog, and manifest-sync goes red on main.
      - name: Regenerate derived manifests
        run: |
          python3 scripts/qa/sync_fallback_manifest.py
          python3 scripts/qa/generate_commons_catalog.py
      - name: Create PR if changed
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): update submodules"
          title: "chore(deps): update submodules"
          body: |
            Automated weekly submodule update.

            CI will run on this PR branch to verify integration before merging.

            Submodules with `update = none` in `.gitmodules` are skipped
            automatically (none currently opt out).
          branch: chore/update-submodules
          delete-branch: true
