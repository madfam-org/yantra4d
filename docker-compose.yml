services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ⚠️ Change REDIS_PASSWORD for production deployments.
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-yantra4d_dev}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-yantra4d_dev}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    shm_size: '2gb'
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./projects:/app/projects:ro
      - analytics_data:/app/backend/data
    environment:
      - FLASK_DEBUG=false
      - PORT=5000
      - PROJECTS_DIR=/app/projects
      # Covers studio (5173 dev / 3000 docker), landing (4321), admin (3001) and additional dev ports
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:4321,http://localhost:3001
      - JANUA_ISSUER=${JANUA_ISSUER:-https://auth.madfam.io}
      - JANUA_AUDIENCE=${JANUA_AUDIENCE:-yantra4d-api}
      # ⚠️  WARNING: Auth and rate limiting are OFF for local dev.
      # Never deploy to production with these settings.
      # Production uses K8s manifests with AUTH_ENABLED=true.
      - AUTH_ENABLED=false
      - RATE_LIMIT_ENABLED=false
      - RATE_LIMIT_STORAGE=redis://:${REDIS_PASSWORD:-yantra4d_dev}@redis:6379
      - REDIS_URL=redis://:${REDIS_PASSWORD:-yantra4d_dev}@redis:6379
      - PUBLIC_STUDIO_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health/ready')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:5000}
        VITE_JANUA_BASE_URL: ${VITE_JANUA_BASE_URL:-}
        VITE_JANUA_CLIENT_ID: ${VITE_JANUA_CLIENT_ID:-yantra4d}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        PUBLIC_STUDIO_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "4321:80"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/" ]
      interval: 30s
      timeout: 10s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:5000}
        VITE_JANUA_BASE_URL: ${VITE_JANUA_BASE_URL:-}
        VITE_JANUA_CLIENT_ID: ${VITE_JANUA_CLIENT_ID:-yantra4d-admin}
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  analytics_data:
