apiVersion: apps/v1
kind: Deployment
metadata:
  name: yantra4d-backend
  labels:
    app.kubernetes.io/name: yantra4d-backend
    app.kubernetes.io/part-of: yantra4d
  annotations:
    # Wave 2, last. The render worker (wave 1) has to be up and beating before
    # the sidecar leaves this pod, otherwise there is a window with no render
    # capacity at all — and with RENDER_WORKER_REQUIRED=true that window is a
    # 503 on /api/health/ready and a restarting API.
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Still 1. The worker is what needed to scale; the API is held here by its
  # Recreate strategy and the ReadWriteOnce analytics PVC.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yantra4d-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yantra4d-backend
        app.kubernetes.io/part-of: yantra4d
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/madfam-org/yantra4d/backend
          imagePullPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: FLASK_DEBUG
              value: "false"
            - name: PORT
              value: "5000"
            - name: REDIS_URL
              value: "redis://yantra4d-redis:6379/0"
            - name: RATE_LIMIT_STORAGE
              value: "redis://yantra4d-redis:6379/1"
            # Must equal the yantra4d-render-output claim size (2Gi) and the
            # same var on the render-worker Deployment.
            - name: RENDER_VOLUME_LIMIT_BYTES
              value: "2147483648"
            - name: CORS_ORIGINS
              value: "https://app.yantra4d.com,https://yantra4d.com,https://admin.yantra4d.com"
            - name: AUTH_ENABLED
              value: "true"
            - name: JANUA_ISSUER
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: JANUA_ISSUER
            - name: JANUA_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: JANUA_AUDIENCE
            - name: AI_PROVIDER
              value: "openai"
            - name: AI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: AI_BASE_URL
                  optional: true
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: AI_API_KEY
                  optional: true
            - name: COTIZA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: COTIZA_WEBHOOK_SECRET
                  optional: true
            - name: FORGESIGHT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: FORGESIGHT_WEBHOOK_SECRET
                  optional: true
            - name: MQTT_ENABLED
              value: "false"
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: RENDER_WORKER_REQUIRED
              value: "true"
            - name: RENDER_WORKER_HEARTBEAT_TTL_SECONDS
              value: "60"
            - name: PUBLIC_STUDIO_URL
              value: "https://app.yantra4d.com"
            - name: ANALYTICS_DB_PATH
              value: "/app/backend/data/.analytics.db"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: render-output-pvc
              mountPath: /app/backend/static
            - name: analytics-pvc
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # Renamed from render-output, for exactly the reason recorded below for
        # analytics-pvc: Argo applies this with ServerSideApply and volumes
        # merge on `name`, so turning the existing render-output emptyDir into a
        # persistentVolumeClaim under the same name would produce one volume
        # holding both types — "may not specify more than 1 volume type" — and
        # the Deployment would fail to apply at all. A new name is a new list
        # entry: the old emptyDir is pruned and this is added.
        #
        # Now a claim rather than an emptyDir because the render worker moved
        # to its own pod and writes finished artifacts here, while this pod is
        # what serves them at /static/. Keep RENDER_VOLUME_LIMIT_BYTES on both
        # Deployments in sync with the claim size (2Gi): the in-process GC
        # reclaims at 75% of that value.
        # History, from when this was an emptyDir: raised from 512Mi, which
        # evicted the pod twice (2026-08-01 17:55 and 2026-08-04 18:00
        # America/Mexico_City) under bulk-render load.
        - name: render-output-pvc
          persistentVolumeClaim:
            claimName: yantra4d-render-output
        # Renamed from analytics-data deliberately. Argo applies this with
        # ServerSideApply, and volumes merge on `name` — so switching an
        # existing volume from emptyDir to persistentVolumeClaim under the same
        # name produced one volume carrying both types:
        #   "may not specify more than 1 volume type"
        # The Deployment then failed to apply at all, which silently blocked
        # every other change in this file, including the render-output limit.
        # A new name is a new list entry: the old emptyDir is pruned, this is
        # added, and no single volume ever holds two types.
        - name: analytics-pvc
          persistentVolumeClaim:
            claimName: yantra4d-analytics
