server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects carry a relative Location. TLS ends before this server, so an
    # absolute one says http://app.yantra4d.com/... (a scheme downgrade hop).
    absolute_redirect off;

    # Hashed Vite assets — immutable long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://yantra4d-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for /api/render-stream
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
    }

    # Proxy generated assets (STLs, GLBs, etc.) directly to the backend
    location /static/ {
        proxy_pass http://yantra4d-backend/static/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Crawl files. Exact matches, so the SPA fallback below cannot answer
    # robots.txt / sitemap.xml / llms.txt with 200 text/html: a file shipped in
    # public/ is served as text/plain or text/xml, a missing one is a real 404.
    # Exact matches rather than a .txt/.xml regex, which would also capture the
    # proxied /api/ and /static/ paths. No add_header here, so the server-level
    # security headers are inherited.
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /llms.txt    { try_files $uri =404; }

    # The catalog route /projects shares its name with public/projects/, the
    # thumbnail directory. With a `$uri/` directory fallback, GET /projects
    # redirected to /projects/ and that answered 403 (a directory with no
    # index), so the Studio's own «Proyectos» link failed on refresh, in a new
    # tab or as a shared link. /projects/ goes back to the route; a thumbnail
    # that is not shipped is a real 404, not index.html as image/webp.
    location = /projects/ {
        return 301 /projects;
    }
    location ~ ^/projects/[^/]+\.(?:webp|svg|png|jpe?g)$ {
        try_files $uri =404;
    }

    # SPA routing - serve index.html for every path that is not a file. No
    # `$uri/`: a directory under public/ is never a page.
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers (CSP, X-Frame-Options, nosniff, Referrer-Policy, HSTS).
    # Repeated in every location above that declares its own add_header.
    include /etc/nginx/snippets/security-headers.conf;
}
