# Mosquitto configuration for Yantra4D local development
# Enables anonymous connections on standard MQTT port and WebSocket port for browser access.

# MQTT over TCP
listener 1883
allow_anonymous true

# MQTT over WebSockets (for browser-based debugging tools like mqtt-explorer)
listener 9001
protocol websockets
allow_anonymous true

# Logging
log_type error
log_type warning
log_type notice
log_type information

# Persistence (disabled for dev — ephemeral state is fine)
persistence false
