name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Check bundle size
        run: |
          npm run build
          TOTAL=$(du -cb dist/assets/*.js 2>/dev/null | tail -1 | cut -f1)
          echo "Total JS bundle: $(( TOTAL / 1024 )) KB"
          if [ "$TOTAL" -gt 2097152 ]; then
            echo "::error::JS bundle size ${TOTAL} bytes exceeds 2MB limit"
            exit 1
          fi

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install ruff pip-audit
      - run: pip-audit --desc || true
      - run: ruff check .
      - run: pip install pytest pytest-cov
      - name: Check for pending migrations
        run: |
          cd $GITHUB_WORKSPACE/apps/api
          flask db upgrade
          flask db check
        env:
          FLASK_APP: app.py
          DATABASE_URL: sqlite:////tmp/yantra4d-ci-migrations.db
          PROJECTS_DIR: ${{ github.workspace }}/projects
      - name: Run backend tests
        run: cd $GITHUB_WORKSPACE/apps/api && pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  e2e:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      - name: Build studio
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('apps/studio/package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/studio/playwright-report/
          retention-days: 14
      - name: Upload visual regression diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs-${{ matrix.project }}
          path: apps/studio/test-results/**/*-diff.png
          retention-days: 14
          if-no-files-found: ignore

  test-geometric-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: pip install -r requirements.txt
      - name: Run Geometric Regression Parity Tests
        run: python3 tests/scripts/geometric_regression.py --tolerance 0.05

  manifest-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - name: Check manifest sync
        run: |
          # Fallback manifest = source minus force_backend (stripped for offline/WASM mode)
          python3 -c "
          import json, sys
          src = json.load(open('projects/gridfinity/project.json'))
          dst = json.load(open('apps/studio/src/config/fallback-manifest.json'))
          # Strip force_backend from source for comparison (fallback intentionally omits it)
          if 'project' in src and 'force_backend' in src['project']:
              del src['project']['force_backend']
          if src != dst:
              print('ERROR: fallback-manifest.json is out of sync with projects/gridfinity/project.json')
              print('Expected (source minus force_backend):')
              print(json.dumps(src, indent=2)[:500])
              print('Got (fallback):')
              print(json.dumps(dst, indent=2)[:500])
              sys.exit(1)
          print('Manifest sync OK')
          "

  manifest-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate Project Manifests
        run: python3 scripts/qa/validate_manifests.py

  metadata-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run metadata consistency audit
        run: python3 scripts/qa/compliance_audit.py --strict

  openapi-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator
      - run: python -m openapi_spec_validator docs/reference/openapi.yaml

  ai-integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Run AI integration tests
        run: pytest tests/integration/test_ai_integration.py -v --tb=short
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY_TEST }}

  ci-success:
    runs-on: ubuntu-latest
    needs: [studio, landing, admin, backend, e2e, test-geometric-parity, manifest-validation, metadata-consistency, openapi-validation]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
