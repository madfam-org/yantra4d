name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      # Blocking: anything that reaches a user's browser.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev
      # Advisory: build-time tooling (vite, vitest, astro) never ships, so a CVE
      # there must not block a deploy — but it stays visible in the log.
      - name: Audit build tooling (advisory)
        run: npm audit --audit-level=high || true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Check bundle size
        run: |
          npm run build
          # This step had never actually run: the coverage step above it failed
          # first for long enough that the job always stopped before reaching
          # here, so the gate was never exercised against a real build. When it
          # finally did run it reported 16 MB against a 2 MB limit.
          #
          # Two things were wrong with the old `du -cb dist/assets/*.js`.
          #
          # It measured uncompressed bytes on disk rather than what a visitor
          # downloads, and it summed every lazily-loaded chunk — so the more the
          # app code-split, the worse it scored, which is backwards.
          #
          # And 13 MB of that 16 MB is one file: the OpenSCAD WASM engine. It is
          # constructed as `new Worker(new URL('./openscad-worker.js', ...))`
          # inside a memoised promise, so it is fetched on the first in-browser
          # render, not at page load. Counting it against a page-weight budget
          # measures something no first-time visitor pays.
          #
          # The gate is therefore app JS, gzipped, against the unchanged 2MB
          # limit — ~851 KB today. The engine is printed alongside so its size
          # stays visible rather than quietly excluded.
          APP=$(for f in dist/assets/*.js; do case "$f" in *openscad-worker*) continue ;; esac; gzip -c "$f" | wc -c; done | awk '{s+=$1} END {print s+0}')
          ENGINE=$(for f in dist/assets/*openscad-worker*.js; do gzip -c "$f" | wc -c; done 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "App JS transfer size (gzipped):  $(( APP / 1024 )) KB   [limit 2048 KB]"
          echo "OpenSCAD WASM engine (gzipped):  $(( ENGINE / 1024 )) KB   [lazy: fetched on first in-browser render]"
          if [ "$APP" -gt 2097152 ]; then
            echo "::error::App JS transfer size ${APP} bytes (gzipped) exceeds 2MB limit"
            exit 1
          fi

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      # Blocking: anything that reaches a user's browser.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev
      # Advisory: build-time tooling (astro, sharp) never ships, so a CVE there
      # must not block a deploy — but it stays visible in the log.
      - name: Audit build tooling (advisory)
        run: npm audit --audit-level=high || true
      - run: npm run test:coverage
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      # Blocking: anything that reaches a user's browser.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev --legacy-peer-deps
      # Advisory: build-time tooling (vite, vitest) never ships, so a CVE there
      # must not block a deploy — but it stays visible in the log.
      - name: Audit build tooling (advisory)
        run: npm audit --audit-level=high --legacy-peer-deps || true
      - run: npm run lint
      - run: npm run build
      # Assert the production auth endpoint was baked into the bundle. This
      # replaces a status probe pinned to a hashed asset filename, which 404'd
      # after the next build and silently stopped checking anything.
      #
      # Deliberately a positive assertion. Grepping for absence of "localhost:"
      # false-positives on @janua/react-sdk, which carries
      # `apiUrl = NEXT_PUBLIC_API_URL || "http://localhost:8000"` defaults —
      # inert here, because every call site passes apiUrl explicitly, and
      # NEXT_PUBLIC_* is a Next.js convention this Vite app never injects.
      - name: Assert production auth endpoint is baked in
        run: |
          if ! grep -rq "auth\.madfam\.io" dist/assets/ 2>/dev/null; then
            echo "::error::Built admin bundle does not reference auth.madfam.io — VITE_JANUA_BASE_URL may be misconfigured, leaving the SDK's localhost:8000 default in play"
            exit 1
          fi
          echo "Production auth endpoint present in built bundle."
      - run: npm run test:coverage

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install ruff pip-audit
      - run: pip-audit --desc || true
      - run: ruff check .
      - run: pip install pytest pytest-cov
      - name: Check for pending migrations
        run: |
          cd $GITHUB_WORKSPACE/apps/api
          flask db upgrade
          flask db check
        env:
          FLASK_APP: app.py
          DATABASE_URL: sqlite:////tmp/yantra4d-ci-migrations.db
          PROJECTS_DIR: ${{ github.workspace }}/projects
      - name: Run backend tests
        run: cd $GITHUB_WORKSPACE/apps/api && pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  e2e:
    # Each desktop project runs 321 specs, and playwright.config.js pins CI to a
    # single worker, so a full pass takes ~38 min against the old 25 min cap. The
    # suite had never once reached the end: it was cancelled around test 212
    # every time, so nobody knew the real pass/fail total.
    #
    # Sharded three ways (~107 specs, ~13 min per shard) rather than raising the
    # worker count, which would run WebGL-heavy viewer specs concurrently on one
    # runner and trade a known problem for a flaky one. Mobile only matches the
    # responsive suite (28 specs, ~4 min) so it stays unsharded.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1, shards: 3 }
          - { project: chromium, shard: 2, shards: 3 }
          - { project: chromium, shard: 3, shards: 3 }
          - { project: firefox,  shard: 1, shards: 3 }
          - { project: firefox,  shard: 2, shards: 3 }
          - { project: firefox,  shard: 3, shards: 3 }
          - { project: webkit,   shard: 1, shards: 3 }
          - { project: webkit,   shard: 2, shards: 3 }
          - { project: webkit,   shard: 3, shards: 3 }
          - { project: mobile,   shard: 1, shards: 1 }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      # The Studio proxies /api and /static to localhost:5000 (vite.config.ts).
      # Without a backend every request proxy-errors, the specs retry until the
      # job hits its timeout, and the whole matrix reports red for a reason that
      # has nothing to do with the change under test.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: apps/api
        run: |
          sudo apt-get update && sudo apt-get install -y openscad
          pip install -r requirements.txt
      - name: Start backend
        working-directory: apps/api
        env:
          PORT: "5000"
          FLASK_DEBUG: "false"
          AUTH_ENABLED: "false"
          PROJECTS_DIR: ${{ github.workspace }}/projects
        run: |
          python app.py > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy within 60s"
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Build studio
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('apps/studio/package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile' && 'chromium' || matrix.project }}
      # Blob so the shards can be merged back into one report and one honest
      # total; a per-shard HTML report only tells you a third of the story. list
      # alongside it because blob alone writes nothing to stdout — the first cut
      # of this left each shard's log silent about which specs ran, which makes
      # triaging one shard harder than before sharding existed.
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=blob,list
        env:
          CI: true
      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/studio/blob-report/
          retention-days: 3
      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload visual regression diffs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/studio/test-results/**/*-diff.png
          retention-days: 14
          if-no-files-found: ignore

  # Merge the shards into one report. Without this the only figures available
  # are per-shard, and the suite's real pass/fail total stays unknown — which is
  # how ~70 failures sat unquantified behind a job that was always cancelled.
  # Runs even when shards fail, because a red suite is exactly when the total
  # matters.
  e2e-report:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci --legacy-peer-deps
        env:
          NPM_MADFAM_TOKEN: ${{ secrets.NPM_MADFAM_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: apps/studio/all-blobs
          pattern: blob-*
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html,list ./all-blobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: apps/studio/playwright-report/
          retention-days: 14

  test-geometric-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: pip install -r requirements.txt
      - name: Run Geometric Regression Parity Tests
        run: python3 tests/scripts/geometric_regression.py --tolerance 0.05

  manifest-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - name: Check manifest sync
        run: python3 scripts/qa/sync_fallback_manifest.py --check
      - name: Check commons catalog is current
        run: python3 scripts/qa/generate_commons_catalog.py --check
      - name: Check graph node catalog matches the engine
        run: python3 scripts/qa/generate_graph_catalog.py --check

  manifest-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate Project Manifests
        run: python3 scripts/qa/validate_manifests.py

  metadata-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run metadata consistency audit
        run: python3 scripts/qa/compliance_audit.py --strict
      # Blocking. Every cartridge must declare the licence it actually ships,
      # client-private work must stay out of the published catalogue, and an
      # upstream copyleft fork must not be relabelled as CERN-OHL-W.
      - name: Audit cartridge licensing
        run: python3 scripts/qa/check_licenses.py --strict-all

  openapi-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openapi-spec-validator
      # Also rejects duplicate mapping keys, which PyYAML resolves silently
      # by keeping the last definition — the plain validator cannot see them.
      - run: python3 scripts/qa/check_openapi.py

  ai-integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.MADFAM_BOT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Run AI integration tests
        run: pytest tests/integration/test_ai_integration.py -v --tb=short
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY_TEST }}

  ci-success:
    runs-on: ubuntu-latest
    needs: [studio, landing, admin, backend, e2e, test-geometric-parity, manifest-validation, metadata-consistency, openapi-validation]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
