apiVersion: apps/v1
kind: Deployment
metadata:
  name: yantra4d-backend
  labels:
    app.kubernetes.io/name: yantra4d-backend
    app.kubernetes.io/part-of: yantra4d
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: yantra4d-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yantra4d-backend
        app.kubernetes.io/part-of: yantra4d
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/madfam-org/yantra4d/backend
          imagePullPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: FLASK_DEBUG
              value: "false"
            - name: PORT
              value: "5000"
            - name: REDIS_URL
              value: "redis://yantra4d-redis:6379/0"
            - name: RATE_LIMIT_STORAGE
              value: "redis://yantra4d-redis:6379/1"
            - name: CORS_ORIGINS
              value: "https://app.yantra4d.com,https://yantra4d.com,https://admin.yantra4d.com"
            - name: AUTH_ENABLED
              value: "true"
            - name: JANUA_ISSUER
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: JANUA_ISSUER
            - name: JANUA_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: JANUA_AUDIENCE
            - name: AI_PROVIDER
              value: "openai"
            - name: AI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: AI_BASE_URL
                  optional: true
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: AI_API_KEY
                  optional: true
            - name: COTIZA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: COTIZA_WEBHOOK_SECRET
                  optional: true
            - name: FORGESIGHT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: yantra4d-secrets
                  key: FORGESIGHT_WEBHOOK_SECRET
                  optional: true
            - name: MQTT_ENABLED
              value: "false"
            - name: RATE_LIMIT_ENABLED
              value: "true"
            - name: RENDER_WORKER_REQUIRED
              value: "true"
            - name: RENDER_WORKER_HEARTBEAT_TTL_SECONDS
              value: "60"
            - name: PUBLIC_STUDIO_URL
              value: "https://app.yantra4d.com"
            - name: ANALYTICS_DB_PATH
              value: "/app/backend/data/.analytics.db"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: render-output
              mountPath: /app/backend/static
            - name: analytics-data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
        - name: render-worker
          image: ghcr.io/madfam-org/yantra4d/backend
          imagePullPolicy: Always
          command: ["python", "/app/worker/render_worker.py"]
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          env:
            - name: FLASK_DEBUG
              value: "false"
            - name: PROJECTS_DIR
              value: "/app/projects"
            - name: PYTHONPATH
              value: "/app/backend"
            - name: REDIS_URL
              value: "redis://yantra4d-redis:6379/0"
            - name: RATE_LIMIT_STORAGE
              value: "redis://yantra4d-redis:6379/1"
            - name: RENDER_WORKER_HEARTBEAT_TTL_SECONDS
              value: "60"
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os, time, redis; r=redis.Redis.from_url(os.environ.get('REDIS_URL', 'redis://localhost:6379'), decode_responses=True); ts=r.get(os.environ.get('RENDER_WORKER_HEARTBEAT_KEY', 'yantra_render_worker_heartbeat')); raise SystemExit(0 if ts and time.time() - int(ts) < int(os.environ.get('RENDER_WORKER_HEARTBEAT_TTL_SECONDS', '60')) else 1)"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: render-output
              mountPath: /app/backend/static
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: render-output
          emptyDir:
            sizeLimit: 512Mi
        - name: analytics-data
          emptyDir:
            sizeLimit: 128Mi
